<form [formGroup]="loginForm" (ngSubmit)="login()" class="form-login">
  <input type="email" nbInput fullWidth status="basic" placeholder="Ingrese email" id="email" formControlName="email" class="input-login">

  <input type="password" nbInput fullWidth status="basic" placeholder="Ingrese contraseña" id="password"
    formControlName="password" class="input-login">

  <button type="submit" nbButton status="primary" fullWidth>Iniciar sesión</button>
</form>
