<div class="submenu">
    <div class="row">
        <div class="col">
            <a class="no-underline" href="javascript:void(0);" (click)="goBack()">
                <i class="bi bi-arrow-left-square-fill"></i>
                <span class="d-none d-md-inline">Volver</span>
            </a>
        </div>
    </div>
</div>

<div class="container">
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-3 p-3 mt-3">
        <div class="col-3">
            <label for="excel" class="form-label">Subir nuevo documento:</label>
            <button class="btn btn-success form-control" (click)="openModalSubirDoc()">
                Subir doc <i class="bi bi-filetype-pdf"></i>
            </button>
        </div>
    </div>
    <div class="table-responsive mb-3 mt-3">
        <table class="table table-striped table-hover text-center">
            <thead class="table-dark" style="cursor: pointer;">
                <tr>
                    <th (click)="ordenarPor('index')">#</th>
                    <th (click)="ordenarPor('nombre')">Nombre</th>
                    <th (click)="ordenarPor('descripcion')">Descripción</th>
                    <th (click)="ordenarPor('tipo')">Tipo</th>
                    <th (click)="ordenarPor('fecCreate')">Fecha</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let doc of listDocuments; let i = index">
                    <td>{{ i + 1 }}</td>
                    <td>{{ doc.nombre }}</td>
                    <td style="max-width: 50px; white-space: normal; word-break: break-word;">
                        {{ doc.descripcion }}
                    </td>
                    <td>{{ doc.tipo }}</td>
                    <td>{{ doc.fecCreate | date:'dd/MM/yyyy' }}</td>
                    <td>
                        <div class="d-flex justify-content-between">
                            <button class="btn btn-info" title="Visible para jugadores o solo club"
                                (click)="visible(doc, doc.docClubesId, doc.visible)">
                                <i [ngClass]="doc.visible === 0 ? 'bi bi-eye' : 'bi bi-eye-slash'"></i>
                            </button>
                            <button *ngIf="doc.file?.toLowerCase().endsWith('.pdf')" class="btn btn-secondary"
                                title="Abrir PDF en nueva pestaña" (click)="abrirPdf(doc.file)">
                                <i class="bi bi-box-arrow-up-right"></i>
                            </button>
                            <button class="btn btn-primary" title="Copiar link del documento"
                                (click)="copyLink(doc.file)">
                                <span class="bi bi-copy"></span>
                            </button>
                            <button class="btn btn-danger" title="Eliminar documento"
                                (click)="confirmarEliminarDoc(i, doc.docClubesId, doc.nombre)">
                                <span class="bi bi-trash"></span>
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal para subir documento del club -->
<div class="modal fade" tabindex="-1" role="dialog" [ngClass]="{ 'show': mostrarModalDocumento }"
    [style.display]="mostrarModalDocumento ? 'block' : 'none'">
    <div class="modal-dialog modal-dialog-centered modal-lg" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">Subir Documento (PDF o Word)</h5>
                <button type="button" class="btn-close" (click)="cerrarModalDocumento()"></button>
            </div>

            <div class="modal-body">
                <form [formGroup]="formDocumento">
                    <div class="mb-3">
                        <label>Nombre del Documento:</label>
                        <input formControlName="nombre" type="text" class="form-control" />
                    </div>

                    <div class="mb-3">
                        <label>Descripción:</label>
                        <textarea formControlName="descripcion" class="form-control" rows="2"></textarea>
                    </div>

                    <div class="mb-3">
                        <label>Tipo:</label>
                        <input formControlName="tipo" type="text" class="form-control" />
                    </div>

                    <div class="mb-3 form-check form-switch">
                        <input type="checkbox" formControlName="visible" class="form-check-input" id="visibleSwitch">
                        <label class="form-check-label" for="visibleSwitch">Visible para jugadores</label>
                    </div>

                    <div class="mb-3">
                        <label>Seleccionar archivo (.pdf o .doc/.docx):</label>
                        <input type="file" class="form-control" (change)="onFileSelected($event)"
                            accept=".pdf,.doc,.docx" />
                    </div>
                </form>
            </div>

            <div class="modal-footer">
                <button class="btn btn-secondary" (click)="cerrarModalDocumento()">Cancelar</button>
                <button class="btn btn-primary" [disabled]="!formDocumento.valid || !archivoSeleccionado"
                    (click)="subirDocumento()">Subir</button>
            </div>
        </div>
    </div>
</div>
