<div class="back-container">
  <div class="btn-back-clean" href="javascript:void(0)" (click)="irAPantalla(1)">
    <i class="bi bi-arrow-left"></i>
    <span>{{ 'COMMON.BACK' | translate }}</span>
  </div>
</div>

<div class="container">    
    <div class="row mt-3 text-center">
        <h2>Puntuaciones de los equipos</h2>
    </div>
    <div *ngIf="loading" class="chart-skeleton mt-3">
        <div class="chart-skeleton-bar" style="height: 40%;"></div>
        <div class="chart-skeleton-bar" style="height: 70%;"></div>
        <div class="chart-skeleton-bar" style="height: 55%;"></div>
        <div class="chart-skeleton-bar" style="height: 85%;"></div>
        <div class="chart-skeleton-bar" style="height: 30%;"></div>
        <div class="chart-skeleton-bar" style="height: 65%;"></div>
        <div class="chart-skeleton-bar" style="height: 50%;"></div>
        <div class="chart-skeleton-bar" style="height: 75%;"></div>
    </div>
    <div class="row mt-3" id="segundo">
        <div class="scroll: auto">
            <div class="col-md-12">
                <canvas style="display: block; box-sizing: border-box; min-height: 200px; max-height: 500px;"
                    height="200" id="barChartUnica"></canvas>
            </div>
        </div>
    </div>
</div>
