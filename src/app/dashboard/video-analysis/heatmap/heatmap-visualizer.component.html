<div class="heatmap-container">
  <div class="heatmap-header">
    <h5><i class="bi bi-map"></i> Mapa de calor</h5>
    <div class="heatmap-filters">
      <select class="form-select form-select-sm" [(ngModel)]="filterCategoryId" (ngModelChange)="onFilterChange()">
        <option [ngValue]="null">Todas las categorías</option>
        <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
      </select>
    </div>
  </div>

  <div class="heatmap-body">
    <!-- Field with heatmap -->
    <div class="field-wrapper">
      <app-field-position [positions]="positions" [interactive]="false" [showHeatmap]="true">
      </app-field-position>
    </div>

    <!-- Stats sidebar -->
    <div class="stats-panel">
      <div class="stat-header">
        <span class="stat-total">{{ totalEvents }} eventos</span>
        <span class="stat-positioned">{{ eventsWithPosition }} con posición</span>
      </div>

      <div class="stats-list">
        <div class="stat-row" *ngFor="let s of statsBreakdown">
          <div class="stat-row-top">
            <span class="stat-dot" [style.background-color]="s.color"></span>
            <span class="stat-name">{{ s.name }}</span>
            <span class="stat-count">{{ s.count }}</span>
          </div>
          <div class="stat-bar">
            <div class="stat-bar-fill" [style.width.%]="s.percent" [style.background-color]="s.color"></div>
          </div>
        </div>
      </div>

      <div class="empty-stats" *ngIf="statsBreakdown.length === 0">
        <i class="bi bi-bar-chart"></i>
        <span>Sin datos aún</span>
      </div>
    </div>
  </div>
</div>
