<div class="back-container">
  <button class="btn-back-sphaira" (click)="goBack()">
    <i class="bi bi-arrow-left"></i> Análisis de Vídeo
  </button>
</div>

<div class="templates-container">
  <div class="templates-header">
    <div class="templates-header-left">
      <div class="templates-icon"><i class="bi bi-grid-3x3-gap"></i></div>
      <div>
        <h3>Plantillas de análisis</h3>
        <span class="template-count">{{ templates.length }} plantillas</span>
      </div>
    </div>
    <button class="btn-sphaira-primary btn-new" (click)="openCreateModal()">
      <i class="bi bi-plus-lg"></i> Nueva plantilla
    </button>
  </div>

  <div class="loading-state" *ngIf="isLoading">
    <div class="spinner-border text-success" role="status"></div>
  </div>

  <div class="templates-grid" *ngIf="!isLoading">
    <div class="template-card" *ngFor="let tpl of templates" (click)="openTemplate(tpl)"
         [class.template-card--default]="isDefault(tpl)">
      <div class="template-card-top">
        <div class="template-badges">
          <span class="system-badge" *ngIf="tpl.isSystem">
            <i class="bi bi-shield-check"></i> Sphaira
          </span>
          <span class="custom-badge" *ngIf="!tpl.isSystem">
            <i class="bi bi-person"></i> Personalizada
          </span>
          <span class="default-badge" *ngIf="isDefault(tpl)">
            <i class="bi bi-star-fill"></i> Por defecto
          </span>
        </div>
        <div class="template-actions">
          <button class="btn-icon btn-default-icon"
                  (click)="setAsDefault(tpl, $event)"
                  [title]="isDefault(tpl) ? 'Plantilla por defecto' : 'Establecer como plantilla por defecto'"
                  [class.btn-default-icon--active]="isDefault(tpl)">
            <i class="bi" [class.bi-star-fill]="isDefault(tpl)" [class.bi-star]="!isDefault(tpl)"></i>
          </button>
          <button class="btn-icon" *ngIf="!tpl.isSystem"
                  (click)="startEditDescription(tpl, $event)" title="Editar descripción">
            <i class="bi bi-pencil"></i>
          </button>
          <button class="btn-icon" (click)="duplicateTemplate(tpl, $event)" title="Duplicar">
            <i class="bi bi-copy"></i>
          </button>
          <button class="btn-icon btn-danger-icon" *ngIf="!tpl.isSystem"
                  (click)="deleteTemplate(tpl, $event)" title="Eliminar">
            <i class="bi bi-trash3"></i>
          </button>
        </div>
      </div>
      <h5>{{ tpl.name }}</h5>

      <!-- Description — view or edit inline -->
      <ng-container *ngIf="editingDescriptionId === tpl.id; else descView">
        <div class="desc-edit-wrap" (click)="$event.stopPropagation()">
          <textarea class="desc-edit-input" rows="2" [(ngModel)]="editDescriptionValue"
                    placeholder="Descripción de la plantilla…"></textarea>
          <div class="desc-edit-actions">
            <button class="btn-desc-save" [disabled]="isSavingDescription"
                    (click)="saveDescription(tpl, $event)">
              <span *ngIf="isSavingDescription" class="spinner-border spinner-border-sm me-1"></span>
              <i *ngIf="!isSavingDescription" class="bi bi-check2 me-1"></i>Guardar
            </button>
            <button class="btn-desc-cancel" (click)="cancelEditDescription($event)">
              <i class="bi bi-x"></i>
            </button>
          </div>
        </div>
      </ng-container>
      <ng-template #descView>
        <p *ngIf="tpl.description">{{ tpl.description }}</p>
        <p class="no-desc" *ngIf="!tpl.description && !tpl.isSystem">
          <i class="bi bi-pencil me-1"></i>Sin descripción — haz clic en <i class="bi bi-pencil"></i> para añadir
        </p>
      </ng-template>

      <div class="template-meta">
        <span *ngIf="tpl.categories">{{ tpl.categories.length }} categorías</span>
      </div>
    </div>
  </div>
</div>

<!-- Create Modal -->
<div class="modal-overlay" *ngIf="showCreateModal" (click)="showCreateModal = false" appModalBackdrop>
  <div class="modal-panel" (click)="$event.stopPropagation()">
    <div class="modal-header-custom">
      <h4><i class="bi bi-grid-3x3-gap me-2"></i>Nueva Plantilla</h4>
      <button class="btn-close-modal" (click)="showCreateModal = false">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
    <div class="modal-body-custom">
      <div class="form-group">
        <label>Nombre *</label>
        <input type="text" class="form-control" placeholder="Ej: Análisis de corners"
               [(ngModel)]="newTemplateName">
      </div>
      <div class="form-group">
        <label>Descripción</label>
        <textarea class="form-control" rows="2" [(ngModel)]="newTemplateDescription"></textarea>
      </div>
    </div>
    <div class="alert alert-danger mx-3" *ngIf="createError" style="font-size: .85rem; margin-bottom: 0;">
      <i class="bi bi-exclamation-triangle-fill"></i> {{ createError }}
    </div>
    <div class="modal-footer-custom">
      <button class="btn btn-outline-secondary" (click)="showCreateModal = false">Cancelar</button>
      <button class="btn-sphaira-primary" (click)="createTemplate()"
              [disabled]="!newTemplateName.trim() || isCreating">
        <span *ngIf="isCreating" class="spinner-border spinner-border-sm me-1"></span>
        <i *ngIf="!isCreating" class="bi bi-check2-circle me-1"></i>
        {{ isCreating ? 'Creando...' : 'Crear plantilla' }}
      </button>
    </div>
  </div>
</div>
