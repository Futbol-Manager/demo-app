<div class="field-container">
  <svg viewBox="0 0 680 440" class="field-svg" (click)="onFieldClick($event)"
       [class.interactive]="interactive">

    <!-- Pitch background -->
    <rect x="0" y="0" width="680" height="440" fill="#2d8a4e" rx="4"/>

    <!-- Outer lines -->
    <rect x="20" y="20" width="640" height="400" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- Center line -->
    <line x1="340" y1="20" x2="340" y2="420" stroke="#fff" stroke-width="2"/>

    <!-- Center circle -->
    <circle cx="340" cy="220" r="60" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="340" cy="220" r="3" fill="#fff"/>

    <!-- Left penalty area -->
    <rect x="20" y="110" width="110" height="220" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="20" y="160" width="40" height="120" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="90" cy="220" r="3" fill="#fff"/>
    <path d="M 130 175 A 60 60 0 0 1 130 265" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- Right penalty area -->
    <rect x="550" y="110" width="110" height="220" fill="none" stroke="#fff" stroke-width="2"/>
    <rect x="620" y="160" width="40" height="120" fill="none" stroke="#fff" stroke-width="2"/>
    <circle cx="590" cy="220" r="3" fill="#fff"/>
    <path d="M 550 175 A 60 60 0 0 0 550 265" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- Corner arcs -->
    <path d="M 20 28 A 8 8 0 0 1 28 20" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M 652 20 A 8 8 0 0 1 660 28" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M 28 420 A 8 8 0 0 1 20 412" fill="none" stroke="#fff" stroke-width="2"/>
    <path d="M 660 412 A 8 8 0 0 1 652 420" fill="none" stroke="#fff" stroke-width="2"/>

    <!-- Goals -->
    <rect x="10" y="195" width="10" height="50" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3"/>
    <rect x="660" y="195" width="10" height="50" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Heatmap cells -->
    <rect *ngFor="let cell of heatmapCells"
          [attr.x]="cell.x * 680" [attr.y]="cell.y * 440"
          [attr.width]="68" [attr.height]="44"
          [attr.fill]="'rgba(231, 76, 60, ' + cell.opacity + ')'"
          rx="2"/>

    <!-- Position markers -->
    <g *ngFor="let pos of positions">
      <circle [attr.cx]="pos.x * 680" [attr.cy]="pos.y * 440" r="5"
              [attr.fill]="pos.color || '#E74C3C'" stroke="#fff" stroke-width="1.5" opacity="0.85"/>
    </g>

    <!-- Last click marker -->
    <g *ngIf="lastClickX !== null && lastClickY !== null">
      <circle [attr.cx]="lastClickX * 680" [attr.cy]="lastClickY * 440" r="8"
              fill="none" stroke="#fff" stroke-width="2" opacity="0.9"/>
      <circle [attr.cx]="lastClickX * 680" [attr.cy]="lastClickY * 440" r="3"
              fill="#fff" opacity="0.9"/>
    </g>
  </svg>
</div>
