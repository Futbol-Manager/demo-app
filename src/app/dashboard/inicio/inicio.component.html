<div *ngIf="datosCargados">
  <!-- Botón para abrir el modal de creación de equipo -->
  <div class="d-flex mt-3">
    <button class="btn btn-success ms-2" (click)="abrirModalCrearEquipo()">Añadir Equipo</button>
  </div>

  <div class="homepage-container">
    <!-- Contenido principal con la tabla de equipos utilizando Bootstrap -->
    <div class="mt-4">

      <div class="container">
        <h2 class="text-dark mt-3">Listado de Equipos de Fútbol</h2>
        <ul class="nav nav-tabs" id="myTab" role="tablist">
          <li class="nav-item" role="presentation">
            <button class="nav-link active" id="list-tab" data-bs-toggle="tab" data-bs-target="#list-content"
              type="button" role="tab" aria-controls="list-content" aria-selected="true">Vista de lista</button>
          </li>
          <li class="nav-item" role="presentation">
            <button class="nav-link" id="card-tab" data-bs-toggle="tab" data-bs-target="#card-content" type="button"
              role="tab" aria-controls="card-content" aria-selected="false">Vista de tarjetas</button>
          </li>
        </ul>
        <div class="tab-content" id="myTabContent">
          <div class="tab-pane fade show active" id="list-content" role="tabpanel" aria-labelledby="list-tab">
            <div class="border p-3">
              <div class="row" *ngFor="let team of listTeam">
                <div class="col mb-3 border border-dark rounded bg-light-green p-2">
                  <div class="row">
                    <div class="col">
                      <h5>{{ team.name }}</h5>
                      <p>
                        <strong>Categoría:</strong> {{ team.category }}<br>
                        <strong>Días:</strong> {{ team.trainingDays }}
                      </p>
                    </div>
                    <div class="col-auto">
                      <div class="d-flex flex-column justify-content-between h-100">
                        <button class="btn btn-primary mb-2 btn-width" (click)="navegarACalendario(team.teamId)">
                          Entrar
                        </button>
                        <button class="btn btn-danger btn-width"
                          (click)="confirmarEliminarEquipo(team.teamId, team.name)">
                          <i class="bi bi-trash"></i> Eliminar
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="tab-pane fade" id="card-content" role="tabpanel" aria-labelledby="card-tab">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4">
              <div class="col mb-3" *ngFor="let team of listTeam">
                <div class="card gradient">
                  <img src="assets/images/madrid.png" class="card-img-top img-half-size mx-auto" alt="Madrid">
                  <div class="card-body text-center">
                    <h5 class="card-title">{{ team.name }}</h5>
                    <p class="card-text">
                      <strong>Categoría:</strong> {{ team.category }}<br>
                      <strong>Días:</strong> {{ team.trainingDays }}
                    </p>
                    <div class="d-flex justify-content-center">
                      <button class="btn btn-primary btn-width me-2" (click)="navegarACalendario(team.teamId)">
                        Entrar
                      </button>
                      <button class="btn btn-danger btn-width"
                        (click)="confirmarEliminarEquipo(team.teamId, team.name)">
                        <i class="bi bi-trash"></i> Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal para la creación de equipo -->
<div class="modal" tabindex="-1" role="dialog" [ngClass]="{'d-block': showModal}">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <!--<h5 class="modal-title">Añadir Equipo</h5>-->
        <div class="mb-3">
          <label for="categoriaEquipo" class="form-label">Categoría del Equipo:</label>
          <select class="form-control" id="categoriaEquipo" name="categoriaEquipo"
            [(ngModel)]="teamNew.categoryType.categoryTypeId">
            <!-- Opciones ajustadas según tus necesidades -->
            <option value="1">LaLiga EA Sports</option>
            <option value="2">Liga F</option>
            <option value="3">LaLiga Hypermotion</option>
            <option value="4">Segunda RFEF Femenina</option>
            <option value="5">Primera RFEF</option>
            <option value="6">Segunda RFEF</option>
            <option value="7">Tercera RFEF</option>
            <option value="8">Tercera RFEF Femenina</option>
            <option value="9">Preferente Autonómica</option>
            <option value="10">Preferente Autonómica Femenina</option>
            <option value="11">Primera Autonómica</option>
            <option value="12">Primera Autonómica Femenina</option>
            <option value="13">Segunda Autonómica</option>
            <option value="14">Tercera Autonómica</option>
            <option value="15">Senior Amateur</option>
            <option value="16">Juvenil</option>
            <option value="17">Juvenil/Cadete Femenina</option>
            <option value="18">Cadete</option>
            <option value="19">Cadete/Infantil Femenina</option>
            <option value="20">Infantil</option>
            <option value="21">Infantil/Alevín Femenina</option>
            <option value="22">Alevín</option>
            <option value="23">Benjamín</option>
            <option value="24">Benjamín/Prebenjamín Femenina</option>
            <option value="25">Prebenjamín</option>
            <option value="26">Debutante</option>
          </select>
        </div>
        <!-- Botón de cerrar con un icono -->
        <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModal()"></button>
      </div>
      <div class="modal-body">
        <!-- Formulario para la creación de equipo con campos separados -->
        <form>
          <!--<div class="mb-3">
            <label for="nombreEquipo" class="form-label">Nombre:</label>
            <input type="text" class="form-control" id="nombreEquipo" name="nombreEquipo" [(ngModel)]="teamNew.name">
          </div>-->
          <div class="mb-3">
            <label for="nivelLiga" class="form-label">Nivel:</label>
            <select class="form-control" id="nivelLiga" name="nivelLiga" [(ngModel)]="teamNew.levelLeague">
              <!-- Opciones ajustadas según tus necesidades -->
              <option value="División de Honor">División de Honor</option>
              <option value="Liga Nacional">Liga Nacional</option>
              <option value="Superliga">Superliga</option>
              <option value="Autonómica">Autonómica</option>
              <option value="Preferente">Preferente</option>
              <option value="Primera">Primera</option>
              <option value="Segunda">Segunda</option>
              <option value="Tercera">Tercera</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="objetivoEquipo" class="form-label">Objetivo del Equipo:</label>
            <input type="text" class="form-control" id="objetivoEquipo" name="objetivoEquipo"
              [(ngModel)]="teamNew.objectiveTeam">
          </div>
          <div class="mb-3">
            <label for="diasEntrenamiento" class="form-label">Días de Entrenamiento:</label>
            <input type="text" class="form-control" id="diasEntrenamiento" name="diasEntrenamiento"
              [(ngModel)]="teamNew.trainingDays">
          </div>
          <div class="mb-3">
            <label for="clubEquipo" class="form-label">Club del Equipo:</label>
            <select class="form-control" id="clubEquipo" name="clubEquipo" [(ngModel)]="teamNew.clubId">
              <option *ngFor="let club of clubList" [value]="club.clubId">{{ club.name }}</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="opinionEquipo" class="form-label">Opinión del Equipo:</label>
            <input type="text" class="form-control" id="opinionEquipo" name="opinionEquipo"
              [(ngModel)]="teamNew.opinionTeam">
          </div>
          <!-- Botón para guardar el nuevo equipo -->
          <button type="button" class="btn btn-success float-end" (click)="crearEquipo()">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>
