<div class="homepage-container">
  <!-- Contenido principal con la tabla de equipos utilizando Bootstrap -->
  <div class="mt-4">
    <h2 class="text-white">Listado de Equipos de Fútbol</h2>

    <div class="container">
      <ul class="nav nav-tabs" id="myTab" role="tablist">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="card-tab" data-bs-toggle="tab" data-bs-target="#card-content" type="button" role="tab" aria-controls="card-content" aria-selected="true">Vista de tarjetas</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="list-tab" data-bs-toggle="tab" data-bs-target="#list-content" type="button" role="tab" aria-controls="list-content" aria-selected="false">Vista de lista</button>
        </li>
      </ul>
      <div class="tab-content" id="myTabContent">
        <div class="tab-pane fade show active" id="card-content" role="tabpanel" aria-labelledby="card-tab">
          <div class="row row-cols-4 flex-wrap">
            <div class="col mx-10" *ngFor="let team of listTeam">
              <div class="card mb-3">
                <img src="assets/images/madrid.png" class="card-img-top img-half-size mx-auto" alt="Madrid">
                <div class="card-body text-center">
                  <h5 class="card-title">{{ team.name }}</h5>
                  <p class="card-text">
                    <strong>Categoría:</strong> {{ team.category }}<br>
                    <strong>Días:</strong> {{ team.trainingDays }}
                  </p>
                  <div class="d-flex justify-content-center">
                    <button class="btn btn-primary me-2" (click)="navegarACalendario(team.teamId)">
                      Entrar
                    </button>
                    <button class="btn btn-danger" (click)="confirmarEliminarEquipo(team.teamId, team.name)">
                      <i class="bi bi-trash"></i> Eliminar
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="tab-pane fade" id="list-content" role="tabpanel" aria-labelledby="list-tab">
          <div class="border p-3">
            <div class="row" *ngFor="let team of listTeam">
              <div class="col mb-3 border border-dark rounded bg-light-green p-2">
                <div class="row">
                  <div class="col">
                    <h5>{{ team.name }}</h5>
                    <p>
                      <strong>Categoría:</strong> {{ team.category }}<br>
                      <strong>Días:</strong> {{ team.trainingDays }}
                    </p>
                  </div>
                  <div class="col-auto">
                    <div class="d-flex flex-column justify-content-between h-100">
                      <button class="btn btn-primary mb-2" (click)="navegarACalendario(team.teamId)">
                        Entrar
                      </button>
                      <button class="btn btn-danger" (click)="confirmarEliminarEquipo(team.teamId, team.name)">
                        <i class="bi bi-trash"></i> Eliminar
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    

    <!-- Botón para abrir el modal de creación de equipo -->
    <button class="btn btn-success" (click)="abrirModalCrearEquipo()">Crear Equipo</button>
  </div>
</div>

<!-- Modal para la creación de equipo -->
<div class="modal" tabindex="-1" role="dialog" [ngClass]="{'d-block': showModal}">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Equipo</h5>
        <button type="button" class="close" (click)="cerrarModal()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- Formulario para la creación de equipo -->
        <form>
          <!-- Campo del formulario con ngModel y nombre asignado -->
          <div class="form-group">
            <label for="nombreEquipo">Nombre:</label>
            <input type="text" class="form-control" id="nombreEquipo" name="nombreEquipo" [(ngModel)]="teamNew.name">
          </div>
          <div class="form-group">
            <label for="nivelLiga">Nivel de Liga:</label>
            <input type="text" class="form-control" id="nivelLiga" name="nivelLiga" [(ngModel)]="teamNew.levelLeague">
          </div>
          <div class="form-group">
            <label for="objetivoEquipo">Objetivo del Equipo:</label>
            <input type="text" class="form-control" id="objetivoEquipo" name="objetivoEquipo"
              [(ngModel)]="teamNew.objectiveTeam">
          </div>
          <div class="form-group">
            <label for="opinionEquipo">Opinión del Equipo:</label>
            <input type="text" class="form-control" id="opinionEquipo" name="opinionEquipo"
              [(ngModel)]="teamNew.opinionTeam">
          </div>
          <div class="form-group">
            <label for="diasEntrenamiento">Días de Entrenamiento:</label>
            <input type="text" class="form-control" id="diasEntrenamiento" name="diasEntrenamiento"
              [(ngModel)]="teamNew.trainingDays">
          </div>
          <div class="form-group">
            <label for="categoriaEquipo">Categoría del Equipo:</label>
            <select class="form-control" id="categoriaEquipo" name="categoriaEquipo"
              [(ngModel)]="teamNew.categoryType.categoryTypeId">
              <!-- Puedes ajustar las opciones según tus necesidades -->
              <option value="1">Categoría 1</option>
              <option value="2">Categoría 2</option>
              <option value="3">Categoría 3</option>
              <option value="4">Categoría 4</option>
              <option value="5">Categoría 5</option>
            </select>
          </div>

          <!-- Botón para guardar el nuevo equipo -->
          <button type="button" class="btn btn-primary" (click)="crearEquipo()">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>
