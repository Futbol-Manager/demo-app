<!-- DASHBOARD TIPO MOBILE -->
<div *ngIf="profileId === 1" class="container dashboard-mobile">

  <h4 class="mb-3 text-primary fw-bold">
    {{ 'NAV.CLUB' | translate }}
  </h4>
  <p class="text-muted mb-4">
    {{ 'NAV.OPTIONS' | translate }}
  </p>

  <div class="row g-3">

    <!-- CUADRO DE MANDO -->
    <div class="col-6 col-md-4">
      <div (click)="irAPantalla(3)" class="dashboard-card">
        <img src="assets/images/estadisticas2.jpg">
        <div class="overlay">
          <i class="bi bi-clipboard2-data"></i>
          <span>{{ 'NAV.CUADRO' | translate }}</span>
        </div>
      </div>
    </div>

    <!-- EQUIPOS -->
    <div class="col-6 col-md-4">
      <div (click)="irAPantalla(9)" class="dashboard-card">
        <img src="assets/images/infoequipo.jpg">
        <div class="overlay">
          <i class="bi bi-people"></i>
          <span>{{ 'NAV.TEAMS' | translate }}</span>
        </div>
      </div>
    </div>

    <!-- DOCUMENTOS -->
    <div class="col-6 col-md-4">
      <div (click)="irAPantalla(6)" class="dashboard-card">
        <img src="assets/images/documentacion.jpg">
        <div class="overlay">
          <i class="bi bi-file-earmark-pdf"></i>
          <span>{{ 'NAV.DOCUMENTS' | translate }}</span>
        </div>
      </div>
    </div>

    <!-- COUTA -->
    <div class="col-6 col-md-4">
      <div (click)="irAPantalla(7)" class="dashboard-card">
        <img src="assets/images/pagarcuota.jpg">
        <div class="overlay">
          <i class="bi bi-bank2"></i>
          <span>{{ 'NAV.NEWPAYS' | translate }}</span>
        </div>
      </div>
    </div>

    <!-- SKELETON MIENTRAS CARGA -->
    <div *ngIf="clubLoading" class="col-6 col-md-4">
      <div class="dashboard-card skeleton"></div>
    </div>

    <div *ngIf="clubLoading" class="col-6 col-md-4">
      <div class="dashboard-card skeleton"></div>
    </div>

    <!-- ROPA -->
    <div *ngIf="!clubLoading && clubOk" class="col-6 col-md-4">
      <div (click)="irAPantalla(2)" class="dashboard-card">
        <img src="assets/images/jugadores.jpg">
        <div class="overlay">
          <i class="bi bi-backpack3"></i>
          <span>{{ 'NAV.CLOTHES' | translate }}</span>
        </div>
      </div>
    </div>

    <!-- PATROCINADORES -->
    <div *ngIf="!clubLoading && clubOk" class="col-6 col-md-4">
      <div (click)="irAPantalla(4)" class="dashboard-card">
        <img src="assets/images/patrocinadores.jpg">
        <div class="overlay">
          <i class="bi bi-collection"></i>
          <span>{{ 'NAV.SPONSORS' | translate }}</span>
        </div>
      </div>
    </div>


  </div>
</div>
