<app-erp-ai-consent-modal></app-erp-ai-consent-modal>
<div class="erp-page">
  <div class="erp-header"><button class="btn-back" (click)="goBack()"><i class="bi bi-arrow-left"></i> Volver</button><h2><i class="bi bi-truck"></i> Proveedores</h2></div>
  <div class="erp-toolbar"><button class="btn-erp-primary" (click)="openNew()"><i class="bi bi-plus-lg"></i> Nuevo proveedor</button></div>
  <div *ngIf="showForm" class="form-card">
    <h4>{{ editId ? 'Editar' : 'Nuevo' }} proveedor</h4>
    <div class="ai-scan-bar">
      <input #fileScan type="file" accept="image/*,.pdf" hidden (change)="scanWithAI($event)">
      <button class="btn-ai-scan" type="button" (click)="fileScan.click()" [disabled]="scanning">
        <i class="bi" [ngClass]="scanning ? 'bi-arrow-repeat spin' : 'bi-magic'"></i>
        {{ scanning ? 'Analizando documento...' : 'Rellenar con IA (tarjeta, presupuesto o PDF)' }}
      </button>
      <span *ngIf="scanWarning" class="scan-feedback" [ngClass]="scanClass()">
        <i class="bi" [ngClass]="scanClass()==='scan-ok' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'"></i>
        {{ scanText() }}
      </span>
    </div>
    <div class="form-grid">
      <div class="form-group"><label>Nombre</label><input [(ngModel)]="form.name"></div>
      <div class="form-group"><label>Categoría</label><select [(ngModel)]="form.category"><option *ngFor="let c of categories" [value]="c">{{ c }}</option></select></div>
      <div class="form-group"><label>NIF/CIF</label><input [(ngModel)]="form.taxId"></div>
      <div class="form-group"><label>Email</label><input [(ngModel)]="form.email"></div>
      <div class="form-group"><label>Teléfono</label><input [(ngModel)]="form.phone"></div>
      <div class="form-group"><label>Plazo pago (días)</label><input type="number" [(ngModel)]="form.paymentTermsDays"></div>
    </div>
    <div class="form-group"><label>Dirección</label><textarea [(ngModel)]="form.address" rows="2"></textarea></div>
    <div class="form-group"><label>Notas</label><textarea [(ngModel)]="form.notes" rows="2"></textarea></div>
    <div class="form-actions"><button class="btn-erp-primary" (click)="save()" [disabled]="saving">Guardar</button><button class="btn-erp-outline" (click)="showForm=false">Cancelar</button></div>
  </div>
  <div *ngIf="loading" class="erp-loading"><i class="bi bi-arrow-repeat spin"></i> Cargando...</div>
  <div *ngIf="!loading && !showForm">
    <div *ngIf="suppliers.length===0" class="erp-empty"><i class="bi bi-truck"></i> No hay proveedores</div>
    <table *ngIf="suppliers.length>0" class="erp-table"><thead><tr><th>Nombre</th><th>Categoría</th><th>NIF</th><th>Email</th><th>Teléfono</th><th></th></tr></thead><tbody>
      <tr *ngFor="let s of suppliers"><td><strong>{{ s.name }}</strong></td><td>{{ s.category }}</td><td>{{ s.taxId || '—' }}</td><td>{{ s.email || '—' }}</td><td>{{ s.phone || '—' }}</td><td><button class="btn-sm-action" (click)="edit(s)"><i class="bi bi-pencil"></i></button></td></tr>
    </tbody></table>
  </div>
</div>
