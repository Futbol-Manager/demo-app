<div class="erp-page">
  <div class="erp-header"><button class="btn-back" (click)="goBack()"><i class="bi bi-arrow-left"></i> Volver</button><h2><i class="bi bi-piggy-bank"></i> Presupuestos</h2></div>
  <div class="erp-toolbar"><button class="btn-erp-primary" (click)="showForm=true"><i class="bi bi-plus-lg"></i> Nuevo presupuesto</button></div>
  <div *ngIf="showForm" class="form-card">
    <h4>Nuevo presupuesto</h4>
    <div class="form-group"><label>Nombre</label><input [(ngModel)]="formName" placeholder="Ej: Presupuesto 2026/27"></div>
    <div class="form-actions"><button class="btn-erp-primary" (click)="createBudget()" [disabled]="saving">Crear</button><button class="btn-erp-outline" (click)="showForm=false">Cancelar</button></div>
  </div>
  <div *ngIf="loading" class="erp-loading"><i class="bi bi-arrow-repeat spin"></i> Cargando...</div>
  <div *ngIf="!loading && !showForm">
    <div *ngIf="budgets.length===0" class="erp-empty"><i class="bi bi-piggy-bank"></i> No hay presupuestos</div>
    <table *ngIf="budgets.length>0" class="erp-table"><thead><tr><th>Nombre</th><th>Estado</th><th>Creado</th><th></th></tr></thead><tbody>
      <tr *ngFor="let b of budgets"><td><strong>{{ b.name }}</strong></td><td><span class="status-badge" [ngClass]="statusClass(b.status)">{{ b.status }}</span></td><td>{{ b.createdAt | date:'dd/MM/yyyy' }}</td><td><button class="btn-sm-action text-danger" (click)="deleteBudget(b)"><i class="bi bi-trash"></i></button></td></tr>
    </tbody></table>
  </div>
</div>
