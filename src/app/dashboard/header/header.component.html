<header class="p-3 mb-3 border-bottom header-custom">
  <div class="container-fluid">
    <div class="row align-items-center justify-content-between">
      <div class="col-auto">
        <img src="assets/images/logo_black.svg" alt="Logo" (click)="goInicio()" style="cursor: pointer; width: 10em;">
      </div>
      <div class="col-auto">
        <div class="dropdown">
          <a class="nav-link dropdown-toggle arrow-none nav-user px-2" data-bs-toggle="dropdown" href="#" role="button" aria-haspopup="false" aria-expanded="false">
            <span class="d-lg-none">
              <span class="account-user-avatar">
                <img src="https://github.com/mdo.png" alt="user-image" width="32" class="rounded-circle me-2">
              </span>
              <h5 class="my-0">Alejandro</h5>
            </span>
            <span class="d-none d-lg-flex flex-column gap-1">
              <span class="account-user-avatar">
                <img src="https://github.com/mdo.png" alt="user-image" width="32" class="rounded-circle me-2">
              </span>
              <h5 class="my-0">Alejandro</h5>
            </span>
          </a>          
          <div class="dropdown-menu dropdown-menu-end dropdown-menu-animated profile-dropdown">
            <!-- item-->
            <div class="dropdown-header noti-title">
              <h6 class="text-overflow m-0">¡Bienvenido!</h6>
            </div>

            <!-- item-->
            <a href="javascript:void(0);" class="dropdown-item" (click)="profile()">
              <i class="mdi mdi-account-circle me-1"></i>
              <span>Perfil</span>
            </a>

            <!-- item-->
            <a href="javascript:void(0);" class="dropdown-item" (click)="logOut()">
              <i class="mdi mdi-logout me-1"></i>
              <span>Cerrar sesión</span>
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
