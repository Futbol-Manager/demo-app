<!-- TASK SHOP PANEL -->
<div class="task-shop-panel">

  <!-- HEADER -->
  <div class="task-shop-header">
    <h2>{{ 'TASKS.MODAL_TITLE' | translate }}</h2>
  </div>

  <!-- FILTERS -->
  <div class="task-filters">

    <input
      type="text"
      class="form-control saas-input"
      [(ngModel)]="textSearch"
      [placeholder]="'TASKS.SEARCH_PLACEHOLDER' | translate"
      (keydown.enter)="filterSearch()">

    <select
      class="form-control saas-input"
      [(ngModel)]="estrategia">
      <option value="-">{{ 'TASKS.SELECT_STRATEGY' | translate }}</option>
      <option *ngFor="let estrategia of estrategias" [value]="estrategia">
        {{ estrategia }}
      </option>
    </select>

    <select
      class="form-control saas-input"
      [(ngModel)]="intencion">
      <option value="-">{{ 'TASKS.SELECT_INTENTION' | translate }}</option>
      <option *ngFor="let intencion of intenciones" [value]="intencion">
        {{ intencion }}
      </option>
    </select>

    <button
      type="button"
      class="btn btn-outline-saas"
      (click)="clearSearch()">
      {{ 'TASKS.CLEAR' | translate }}
    </button>

    <button
      type="button"
      class="btn btn-primary-saas"
      (click)="filterSearch()">
      {{ 'TASKS.SEARCH' | translate }}
    </button>

  </div>

  <!-- TASK GRID -->
  <div class="task-grid">

    <!-- Loading spinner -->
    <div *ngIf="loadingTasks" class="task-loading">
      <span class="spinner-border spinner-border-sm"></span>
      <span>Cargando tareas...</span>
    </div>

    <!-- Empty state -->
    <div *ngIf="!loadingTasks && taskList.length === 0" class="task-empty">
      <i class="bi bi-cloud-slash"></i>
      <p>No hay tareas disponibles.<br>Prueba con otros filtros o comparte la primera.</p>
    </div>

    <div
      class="task-card"
      *ngFor="let tarea of taskList"
      [class.selected]="tarea === selectedTask"
      (click)="seleccionarTarea(tarea)">

      <div class="task-image">
        <img
          [src]="tarea.imagenBoard ? imageBaseUrlTask + tarea.imagenBoard : 'https://appsphairatech.com/images/task-board/blank.png'"
          alt="{{ 'TASKS.NO_IMAGE_ALT' | translate }}">
      </div>

      <div class="task-content">
        <div class="task-content-header">
          <span class="task-id">
            {{ 'TASKS.ID' | translate }} {{ tarea.tasksShopId }}
          </span>
          <button
            type="button"
            class="btn-fav"
            [class.is-fav]="isFav(tarea)"
            (click)="toggleFav($event, tarea)"
            [attr.aria-label]="'TASKS.TOGGLE_FAV' | translate">
            <i class="bi" [ngClass]="isFav(tarea) ? 'bi-star-fill' : 'bi-star'"></i>
          </button>
        </div>

        <h5 class="task-title">{{ tarea.slogans }}</h5>

        <div class="task-tags">
          <span class="badge badge-secondary">{{ tarea.estrategia }}</span>
          <span class="badge badge-primary">{{ tarea.intencion }}</span>
        </div>

        <p class="task-desc">{{ tarea.description }}</p>

        <button
          type="button"
          class="btn btn-success-saas"
          (click)="descargarTarea(tarea)">
          {{ 'TASKS.ADD_TASK' | translate }}
        </button>
      </div>

    </div>

  </div>

</div>
