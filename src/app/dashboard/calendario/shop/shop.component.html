<div class="modal" role="dialog" class="d-block">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header d-flex">
        <div>
          <h2>Selecciona una tarea para descargarla</h2>
        </div>
        <div>
          <label for="work">Tipo de Trabajo:</label>
          <select class="form-control" (change)="onTipoTrabajoSeleccionado($event)">
              <option disabled selected>Selecciona un tipo de trabajo</option>
              <option value="Trabajo Físico">Trabajo Físico</option>
              <option value="Resistencia">Resistencia</option>
              <option value="Juegos de posesión">Juegos de posesión</option>
              <option value="Juegos de posición">Juegos de posición</option>
              <option value="Ataque - Defensa">Ataque - Defensa</option>
              <option value="Partidos reducidos">Partidos reducidos</option>
              <option value="Partidos condicionados">Partidos condicionados</option>
              <option value="Acciones combinadas">Acciones combinadas</option>
              <option value="Finalizaciones">Finalizaciones</option>
              <option value="Fuerza">Fuerza</option>
              <option value="Circuitos Físicos">Circuitos Físicos</option>
              <option value="Juego de Posesión">Juego de Posesión</option>
              <option value="Ataque – Defensa">Ataque – Defensa</option>
              <option value="Finalizaciones">Finalizaciones</option>
              <option value="Velocidad">Velocidad</option>
              <option disabled>──────────</option>
              <option value="Trabajo Táctico">Trabajo Táctico</option>
              <option value="Trabajo por posiciones">Trabajo por posiciones</option>
              <option value="Trabajo por líneas">Trabajo por líneas</option>
              <option value="Específicos">Específicos</option>
              <option disabled>──────────</option>
              <option value="Tecnificación">Tecnificación</option>
              <option disabled>──────────</option>
              <option value="ABP">ABP</option>
              <option value="Faltas laterales">Faltas laterales</option>
              <option value="Faltas frontales">Faltas frontales</option>
              <option value="Corners">Corners</option>
              <option disabled>──────────</option>
              <option value="Trabajo Preventivo">Trabajo Preventivo</option>
              <option value="Core">Core</option>
              <option value="Estabilización de rodilla">Estabilización de rodilla</option>
              <option value="Glúteos">Glúteos</option>
              <option value="Cuádriceps">Cuádriceps</option>
              <option value="Aductores">Aductores</option>
              <option value="Isquiotibiales">Isquiotibiales</option>
              <option value="Gemelos">Gemelos</option>
              <option value="Propiocepción">Propiocepción</option>
          </select>
          <button type="button" class="btn btn-success mt-3" (click)="descargarTarea(selectedTask)" *ngIf="downloadTask">Descargar Tarea</button>
        </div>
      </div>
      <div class="modal-body">
        <div class="card" *ngFor="let tarea of taskList; let i = index" [class.selected]="tarea === selectedTask"
          (click)="seleccionarTarea(tarea)">
          <div class="card-body">
            <h5 class="card-title">{{ tarea.slogans }}</h5>
            <p class="card-text">{{ tarea.description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
