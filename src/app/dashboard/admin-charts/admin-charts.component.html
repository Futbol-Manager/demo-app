<!-- BACK BUTTON -->
<div class="back-container">
  <button class="btn-back-clean" (click)="goBack()">
    <i class="bi bi-arrow-left"></i>
    <span>{{ 'COMMON.BACK' | translate }}</span>
  </button>
</div>

<!-- LOADING -->
<div *ngIf="loading" class="loading-container">
  <div class="spinner-border text-primary" role="status">
    <span class="visually-hidden">Cargando...</span>
  </div>
  <span class="loading-text mt-2">Cargando estadísticas...</span>
</div>

<!-- CHARTS -->
<div *ngIf="!loading && data" class="container-fluid charts-wrapper">

  <!-- ROW 1: Line + Doughnut -->
  <div class="row g-4 mb-4">

    <!-- LINE CHART -->
    <div class="col-lg-8 col-md-7">
      <div class="chart-card card shadow-sm border-0">
        <div class="card-body">
          <h6 class="chart-title">
            <i class="bi bi-graph-up me-2"></i>Crecimiento mensual
          </h6>
          <div class="canvas-wrapper">
            <canvas #lineCanvas class="chart-canvas" style="width:100%; height:350px;"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- DOUGHNUT CHART -->
    <div class="col-lg-4 col-md-5">
      <div class="chart-card card shadow-sm border-0">
        <div class="card-body">
          <h6 class="chart-title">
            <i class="bi bi-pie-chart me-2"></i>Suscripciones
          </h6>
          <div class="canvas-wrapper">
            <canvas #doughnutCanvas class="chart-canvas" style="width:100%; height:350px;"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ROW 2: Horizontal Bar Chart -->
  <div class="row g-4 mb-4">
    <div class="col-12">
      <div class="chart-card card shadow-sm border-0">
        <div class="card-body">
          <h6 class="chart-title">
            <i class="bi bi-bar-chart-line me-2"></i>Top clubes por jugadores
          </h6>
          <div class="canvas-wrapper">
            <canvas #barCanvas class="chart-canvas"
              [style.width]="'100%'"
              [style.height.px]="barCanvasHeight">
            </canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- NO DATA -->
<div *ngIf="!loading && !data" class="text-center py-5">
  <i class="bi bi-exclamation-triangle fs-1 text-warning"></i>
  <p class="mt-3 text-muted">No se pudieron cargar las estadísticas.</p>
</div>
