<div class="back-container">
  <button class="btn-back-clean" (click)="goBack()">
    <i class="bi bi-arrow-left"></i>
    <span>Volver</span>
  </button>
</div>

<!-- HERO CARRUSEL -->
<section class="sponsor-hero" *ngIf="listPatrocinadores.length">
  <div class="carousel-track">
    <ng-container *ngFor="let s of listPatrocinadores">
      <img *ngIf="s.imagen && s.oculto === 1" [src]="imageBaseUrl + s.imagen" class="hero-logo">
    </ng-container>

    <!-- Duplicado para scroll infinito -->
    <ng-container *ngFor="let s of listPatrocinadores">
      <img *ngIf="s.imagen && s.oculto === 1" [src]="imageBaseUrl + s.imagen" class="hero-logo">
    </ng-container>
  </div>
</section>

<!-- GRID -->
<section class="container sponsor-grid" *ngIf="datosCargados">

  <!-- HEADER DE LA GRID -->
  <div class="row mb-3">
    <div class="col-12 d-flex justify-content-end">
      <button *ngIf="profileId < 3" class="btn-create-sponsor" (click)="abrirModalPatrocinador()">
        <i class="bi bi-plus-lg"></i>
        Nuevo patrocinador
      </button>
    </div>
  </div>

  <!-- ✅ ROW CORRECTO PARA LAS CARDS -->
  <div class="row g-4">

    <div class="col-12 col-lg-6" *ngFor="let patro of listPatrocinadores; let i = index">

      <article class="sponsor-card">

        <!-- LOGO -->
        <div class="card-logo">
          <img [src]="patro.imagen
              ? imageBaseUrl + patro.imagen
              : 'https://appsphairatech.com/images/task-board/blank.png'">
        </div>

        <!-- CONTENT -->
        <div class="card-content">
          <h3>{{ patro.nombre }}</h3>

          <p class="card-desc compact">
            {{ patro.descripcion }}
          </p>

          <div class="card-links">
            <a [href]="patro.web" target="_blank" class="link-pill">
              <i class="bi bi-globe"></i>
              <span>Web</span>
            </a>

            <a href="mailto:{{patro.mail}}" class="link-pill">
              <i class="bi bi-envelope"></i>
              <span>Email</span>
            </a>

            <a href="tel:{{patro.telefono}}" class="link-pill">
              <i class="bi bi-telephone"></i>
              <span>Teléfono</span>
            </a>
          </div>


          <div class="benefits">
            <strong>Beneficios</strong>
            <p>{{ patro.beneficios }}</p>
          </div>
        </div>

        <!-- FOOTER -->
        <footer class="card-footer">
          <div class="form-check form-switch" *ngIf="profileId < 3">
            <input class="form-check-input" type="checkbox" [checked]="patro.oculto === 1"
              (change)="toggleChaneOculto(patro.oculto, patro.patrocinadorId)">
            <label>Carrusel</label>
          </div>

          <div class="footer-actions">
            <button class="btn-view" (click)="openPatrocinador(patro, i)">
              <i class="bi bi-eye"></i> Ver
            </button>

            <button *ngIf="profileId < 3" class="btn-delete" (click)="confirmDeletePatrocinador(
                      patro.patrocinadorId, i, patro.nombre)">
              <i class="bi bi-trash"></i> Eliminar
            </button>
          </div>
        </footer>

      </article>
    </div>

  </div>
</section>



<!-- Modal para la crear un patrocinador -->
<div class="modal" tabindex="-1" role="dialog" [ngClass]="{'d-block': showModalCrearPatro}">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="stripeModalLabel">Patrocinador</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="cerrarModalCrearPatro()"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="row text-center">
              <!-- Primera columna principal -->
              <div class="col-12 col-md-12">
                <div class="row mt-3">
                  <div class="col-12 col-md-12">
                    <!-- Contenido de la subcolumna -->
                    <label><strong>Datos del Patrocinador:</strong></label>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="nombre" name="nombre"
                        [(ngModel)]="patrocinadorObj.nombre" placeholder="Nombre" #primerCampo>
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="web" name="web"
                        [(ngModel)]="patrocinadorObj.web" placeholder="Web">
                    </div>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <textarea class="form-control custom-input" id="descripcion" name="descripcion"
                        [(ngModel)]="patrocinadorObj.descripcion" rows="5" placeholder="Descripción"
                        maxlength="300"></textarea>
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <textarea class="form-control custom-input" id="beneficios" name="beneficios"
                        [(ngModel)]="patrocinadorObj.beneficios" rows="5" placeholder="Beneficios"
                        maxlength="300"></textarea>
                    </div>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="telefono" name="telefono"
                        [(ngModel)]="patrocinadorObj.telefono" placeholder="Teléfono" maxlength="9">
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="mail" class="form-control custom-input" id="email" name="email"
                        [(ngModel)]="patrocinadorObj.mail" placeholder="Email">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer mt-3">
              <!-- Botón para guardar el nuevo equipo -->
              <button type="button" class="btn btn-success float-end"
                (click)="createUpdatePatrocinador(1)">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Modal para modificar el patrocinador -->
<div class="modal" tabindex="-1" role="dialog" [ngClass]="{'d-block': showModalUpdatePatrocinador}">
  <div class="modal-dialog modal-xl" role="document">
    <div class="modal-content">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="stripeModalLabel">Patrocinador</h5>
          <button type="button" class="btn-close" aria-label="Close" (click)="cerrarPatrocinador()"></button>
        </div>
        <div class="modal-body">
          <form>
            <div class="row text-center">
              <!-- Primera columna principal -->
              <div class="col-12 col-md-12">
                <div class="row text-center align-items-center">
                  <div class="col-12 col-md-12">
                    <!-- Contenido de la subcolumna -->
                    <ng-container *ngIf="patrocinadorUpdate.patrocinadorId !== 0">
                      <div class="form-group">
                        <ng-container *ngIf="patrocinadorUpdate.imagen">
                          <div class="text-center mb-3">
                            <img [src]="imageBaseUrl + patrocinadorUpdate.imagen" alt="Imagen del patrocinador"
                              class="img-fluid rounded shadow-sm" style="max-width: 400px; height: auto;">
                          </div>
                        </ng-container>
                        <ng-container *ngIf="!patrocinadorUpdate.imagen">
                          <span class="bi bi-person" style="font-size: 3rem;"></span>
                        </ng-container>
                        <h4>Sube la imagen del patrocinador</h4>
                        <p style="color: red;">Se recomienda un tamaño de 400 de ancho x 150 de alto.</p>
                        <form (submit)="onSubmit(patrocinadorUpdate.patrocinadorId)" enctype="multipart/form-data">
                          <div class="form-group">
                            <p>Seleccionar imagen en formato JPG o PNG:</p>
                            <input type="file" id="image" (change)="onFileSelected($event)">
                            <div *ngIf="showPreview" style="margin-top: 2em;">
                              <img [src]="imagePreviewUrl" alt="Image Preview" class="img-fluid rounded shadow-sm"
                                style="max-width: 400px; height: auto;">
                              <button *ngIf="showbtnupimg" style="margin-top: 1em;" type="submit"
                                class="btn btn-success">Subir
                                imagen</button>
                            </div>
                          </div>
                        </form>
                      </div>
                    </ng-container>
                    <ng-container *ngIf="patrocinadorUpdate.patrocinadorId == 0">
                      <span class="bi bi-person" style="font-size: 3rem;"></span>
                    </ng-container>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-12">
                    <!-- Contenido de la subcolumna -->
                    <label><strong>Editar datos del Patrocinador:</strong></label>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="nombre" name="nombre"
                        [(ngModel)]="patrocinadorUpdate.nombre" placeholder="Nombre" #primerCampo>
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="web" name="web"
                        [(ngModel)]="patrocinadorUpdate.web" placeholder="Web">
                    </div>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <textarea class="form-control custom-input" id="descripcion" name="descripcion"
                        [(ngModel)]="patrocinadorUpdate.descripcion" rows="5" placeholder="Descripción"
                        maxlength="300"></textarea>
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <textarea class="form-control custom-input" id="beneficios" name="beneficios"
                        [(ngModel)]="patrocinadorUpdate.beneficios" rows="5" placeholder="Beneficios"
                        maxlength="300"></textarea>
                    </div>
                  </div>
                </div>
                <div class="row mt-3">
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="telefono" name="telefono"
                        [(ngModel)]="patrocinadorUpdate.telefono" placeholder="Teléfono" maxlength="9">
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="mail" class="form-control custom-input" id="email" name="email"
                        [(ngModel)]="patrocinadorUpdate.mail" placeholder="Email">
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="modal-footer mt-3">
              <!-- Botón para guardar el nuevo equipo -->
              <button type="button" class="btn btn-success float-end"
                (click)="createUpdatePatrocinador(2)">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

                    <ng-container *ngIf="patrocinadorUpdate.patrocinadorId !== 0">

                        <ng-container *ngIf="patrocinadorUpdate.imagen">

                    <!-- Contenido de la subcolumna -->

                      <textarea class="form-control custom-input" id="descripcion" name="descripcion"

                    <!-- Contenido de la subcolumna -->

                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="text" class="form-control custom-input" id="telefono" name="telefono"
                        [(ngModel)]="patrocinadorUpdate.telefono" placeholder="Teléfono" maxlength="9" readonly="true">
                    </div>
                  </div>
                  <div class="col-12 col-md-6">
                    <!-- Contenido de la subcolumna -->
                    <div class="form-group">
                      <input type="mail" class="form-control custom-input" id="email" name="email"
