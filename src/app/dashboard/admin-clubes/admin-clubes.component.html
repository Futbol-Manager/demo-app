<div class="container mt-4">
    <div class="card mb-4 shadow-sm">
        <div class="card-body">
            <div class="row align-items-center">
                <div class="col-md-8">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-end-0">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" class="form-control border-start-0 ps-0" [(ngModel)]="searchTerm"
                            placeholder="Buscar club por nombre...">
                    </div>
                </div>
                <div class="col-md-4 text-end">
                    <span class="badge bg-primary p-2">Total: {{filteredClubs.length}} clubes</span>
                </div>
            </div>
        </div>
    </div>

    <div class="table-responsive shadow-sm rounded">
        <table class="table table-hover align-middle bg-white">
            <thead class="table-dark">
                <tr>
                    <th>Nombre del Club</th>
                    <th class="text-center">Equipos</th>
                    <th class="text-center">Entrenadores</th>
                    <th class="text-center">Jugadores</th>
                    <th class="text-center">Padres</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let club of filteredClubs">
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="club-icon-placeholder me-2">
                                <i class="bi bi-shield-shaded text-primary fs-4"></i>
                            </div>
                            <span class="fw-bold text-primary" (click)="goToClub(club.id, club.clubId)" style="cursor: pointer;">
                                {{ club.nombre }}
                            </span>
                        </div>
                    </td>
                    <td class="text-center"><span class="badge rounded-pill bg-light text-dark border">{{ club.equipos
                            }}</span></td>
                    <td class="text-center">{{ club.entrenadores }}</td>
                    <td class="text-center">{{ club.jugadores }}</td>
                    <td class="text-center">{{ club.padres }}</td>
                    <td class="text-end">
                        <button (click)="verDetalleClub(club.id)" class="btn btn-outline-primary btn-sm me-1">
                            <i class="bi bi-eye"></i>
                        </button>
                        <button class="btn btn-outline-secondary btn-sm">
                            <i class="bi bi-pencil"></i>
                        </button>
                    </td>
                </tr>

                <tr *ngIf="filteredClubs.length === 0">
                    <td colspan="6" class="text-center py-4 text-muted">
                        <i class="bi bi-info-circle me-2"></i> No se encontraron clubes que coincidan con
                        "{{searchTerm}}"
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
