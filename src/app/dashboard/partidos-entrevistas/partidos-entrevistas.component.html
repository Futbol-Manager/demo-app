<div class="submenu">
    <div class="row">
        <div class="col" *ngIf="this.usuarioActual!.profileType.profileId > 2">
            <a class="no-underline" href="javascript:void(0);" (click)="goBack()">
                <i class="bi bi-arrow-left-square-fill"></i>
                <span class="d-none d-md-inline">Volver</span>
            </a>
        </div>
    </div>
</div>

<app-publicidad></app-publicidad>


<div class="container">
    <!-- Banner de partidos -->
    <div class="d-flex justify-content-between align-items-center">
        <button (click)="prev()" class="btn btn-primary" [disabled]="currentIndex === 0">‹</button>

        <div class="d-flex flex-wrap justify-content-center">
            <div *ngFor="let item of getVisibleItems()" class="card m-2" style="width: 12rem; cursor: pointer;"
                (click)="seleccionarPartido(item)">
                <!-- <img [src]="item.imgEquipo" class="card-img-top" alt="Equipo"> -->
                <div class="card-body text-center">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">Resultado: {{ item.resultado }}</p>
                    <span class="badge" [ngClass]="{
            'bg-success': item.letra === 'V', 
            'bg-danger': item.letra === 'D', 
            'bg-secondary': item.letra === 'E'
          }">
                        {{ item.letra }}
                    </span>
                </div>
            </div>
        </div>
        <button (click)="next()" class="btn btn-primary" [disabled]="currentIndex + 4 >= partidos.length">›</button>
    </div>

    <!-- Galería -->
    <div *ngIf="selectedPartido" class="gallery-container mt-3">
        <h3>{{ selectedPartido.name }}</h3>

        <!-- Botones para subir imagen y video -->
        <div class="row justify-content-center">
            <div class="col-md-6 d-flex justify-content-center">
                <input type="file" (change)="subirImagen($event)" class="btn btn-secondary">
            </div>
            <div class="col-md-6 d-flex justify-content-center">
                <button class="btn btn-primary" (click)="abrirModalYoutube()">Subir Video YouTube</button>
            </div>
        </div>


        <div class="gallery">
            <div *ngFor="let item of selectedPartido; let i = index" class="gallery-item">
                <!-- Si es imagen -->
                <img *ngIf="item.tipo === 0" [src]="imageBaseUrlGaleria + item.urlImg" class="gallery-img"
                    (click)="abrirModal(imageBaseUrlGaleria + item.urlImg)">

                <!-- Si es video -->
                <iframe *ngIf="item.tipo === 1" [src]="getYouTubeEmbedUrl(item.link)" frameborder="0" allowfullscreen
                    class="gallery-video"></iframe>

                <!-- Botón eliminar (solo si el usuario es dueño del contenido) -->
                <button *ngIf="item.playerId === playerId" type="button"
                    class="btn btn-danger btn-sm d-flex align-items-center position-absolute top-0 end-0 m-1"
                    (click)="eliminarImagen(item.galeriaPartidoId, i)">
                    <i class="bi bi-trash"></i>
                </button>

            </div>
        </div>
    </div>
</div>

<!-- Modal para ver la imagen en grande -->
<div *ngIf="imagenSeleccionada" class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-content">
        <span class="close-btn" (click)="cerrarModal()">&times;</span>
        <img [src]="imagenSeleccionada" class="modal-img">
    </div>
</div>

<!-- Modal para agregar video de YouTube -->
<div *ngIf="mostrarModalYoutube" class="modal-overlay">
    <div class="modal-content">
        <h4>Agregar Video de YouTube</h4>
        <input type="text" [(ngModel)]="youtubeUrl" placeholder="Pega el enlace de YouTube" class="form-control">
        <button class="btn btn-success mt-2" (click)="agregarVideoYoutube()">Agregar</button>
        <button class="btn btn-secondary mt-2" (click)="cerrarModalYoutube()">Cancelar</button>
    </div>
</div>
