<div class="submenu">
    <div class="row">
        <div class="col">
            <a class="no-underline" href="javascript:void(0);" (click)="goBack()">
                <i class="bi bi-arrow-left-square-fill"></i>
                <span class="d-none d-md-inline">Volver</span>
            </a>
        </div>
    </div>
</div>

<app-publicidad></app-publicidad>


<div class="container">
    <!-- Banner de partidos -->
    <div class="d-flex justify-content-between align-items-center">
        <button (click)="prev()" class="btn btn-primary" [disabled]="currentIndex === 0">‹</button>

        <div class="d-flex flex-wrap justify-content-center">
            <div *ngFor="let item of getVisibleItems()" class="card m-2 partido-card"
                [ngClass]="{'seleccionado': postpartidoSelected === item.id}" (click)="seleccionarPartido(item)"
                style="width: 12rem; cursor: pointer;">

                <div class="card-body text-center">
                    <h5 class="card-title">{{ item.name }}</h5>
                    <p class="card-text">Resultado: {{ item.resultado }}</p>
                    <span class="badge" [ngClass]="{
                    'bg-success': item.letra === 'V', 
                    'bg-danger': item.letra === 'D', 
                    'bg-secondary': item.letra === 'E'
                }">
                        {{ item.letra }}
                    </span>
                </div>
            </div>
        </div>

        <button (click)="next()" class="btn btn-primary" [disabled]="currentIndex + 4 >= partidos.length">›</button>
    </div>

    <!-- Galería -->
    <!-- Contenedor de pestañas -->
    <div class="mt-3" *ngIf="showGalery">
        <ul class="nav nav-tabs" id="galeriaTabs">
            <li class="nav-item">
                <a class="nav-link active" id="fotos-tab" data-bs-toggle="tab" href="#fotos">Fotos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" id="videos-tab" data-bs-toggle="tab" href="#videos">Videos</a>
            </li>
        </ul>

        <div class="tab-content mt-3">
            <!-- Pestaña de Fotos -->
            <div class="tab-pane fade show active" id="fotos">
                <div class="text-center mb-3">
                    <form (submit)="onSubmit()" enctype="multipart/form-data">
                        <div class="form-group">
                            <p>Seleccionar imagen en formato JPG o PNG:</p>
                            <input type="file" id="image" (change)="onFileSelected($event)">
                            <div *ngIf="showPreview" style="margin-top: 2em;">
                                <img [src]="imagePreviewUrl" alt="Image Preview" width="150"
                                    height="150" class="rounded-circle me-2">

                                <!-- Botones alineados verticalmente -->
                                <div class="d-grid gap-2 mt-3">
                                    <button (click)="rotateImage()" type="button"
                                        class="btn btn-primary btn-lg">
                                        Rotar Imagen
                                    </button>
                                    <button *ngIf="showbtnupimg" type="submit"
                                        class="btn btn-success btn-lg">
                                        Subir foto
                                    </button>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>

                <div class="row">
                    <div *ngFor="let foto of fotos; let i = index" class="col-lg-4 col-md-6 col-12 mb-3">
                        <div class="gallery-item position-relative">
                            <img [src]="imageBaseUrlGaleria + foto.urlImg" class="img-fluid rounded shadow-sm"
                                (click)="abrirModal(imageBaseUrlGaleria + foto.urlImg)">

                            <button *ngIf="foto.playerId === playerId" type="button"
                                class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1"
                                (click)="eliminarImagen(foto.galeriaPartidoId, i, 0)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pestaña de Videos -->
            <div class="tab-pane fade" id="videos">
                <div class="text-center mb-3">
                    <button class="btn btn-primary" (click)="abrirModalYoutube()">Subir Video YouTube</button>
                </div>

                <div class="row">
                    <div *ngFor="let video of videos; let a = index" class="col-lg-4 col-md-6 col-12 mb-3">
                        <div class="gallery-item position-relative">
                            <iframe [src]="getYouTubeEmbedUrl(video.link)" frameborder="0" allowfullscreen
                                class="w-100 rounded shadow-sm" style="height: 200px;"></iframe>

                            <button *ngIf="video.playerId === playerId" type="button"
                                class="btn btn-danger btn-sm position-absolute top-0 end-0 m-1"
                                (click)="eliminarImagen(video.galeriaPartidoId, a, 1)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<!-- Modal para ver la imagen en grande -->
<div *ngIf="imagenSeleccionada" class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-content">
        <span class="close-btn" (click)="cerrarModal()">&times;</span>
        <img [src]="imagenSeleccionada" class="modal-img">
    </div>
</div>

<!-- Modal para agregar video de YouTube -->
<div *ngIf="mostrarModalYoutube" class="modal-overlay">
    <div class="modal-content">
        <h4>Agregar Vídeo de YouTube</h4>
        <input type="text" [(ngModel)]="youtubeUrl" placeholder="Pega el enlace de YouTube" class="form-control">
        <button class="btn btn-success mt-2" (click)="agregarVideoYoutube()">Agregar</button>
        <button class="btn btn-secondary mt-2" (click)="cerrarModalYoutube()">Cancelar</button>
    </div>
</div>
