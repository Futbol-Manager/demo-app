<!-- ═══════════════════════════════════════
     BOTÓN FLOTANTE (siempre fixed abajo-derecha)
═══════════════════════════════════════ -->
<div class="ai-fab-btn-wrapper" *ngIf="isVisible">
  <button class="ai-fab-btn" (click)="toggleChat()" [class.open]="isOpen" aria-label="Asistente IA">
    <i class="bi" [ngClass]="isOpen ? 'bi-x-lg' : 'bi-robot'"></i>
    <span class="fab-pulse" *ngIf="!isOpen"></span>
  </button>
</div>

<!-- ═══════════════════════════════════════
     POPUP FLOTANTE (position fixed, draggable, resizable)
═══════════════════════════════════════ -->
<div class="ai-fab-popup"
     *ngIf="isOpen && isVisible"
     [style.left.px]="popupX"
     [style.top.px]="popupY"
     [style.width.px]="popupW"
     [style.height.px]="popupH"
     [class.dragging]="isDragging"
     [class.resizing]="isResizing">

  <!-- RESIZE HANDLES -->
  <div class="fab-resize-handle handle-n" (mousedown)="startResize($event, 'n')"></div>
  <div class="fab-resize-handle handle-s" (mousedown)="startResize($event, 's')"></div>
  <div class="fab-resize-handle handle-e" (mousedown)="startResize($event, 'e')"></div>
  <div class="fab-resize-handle handle-w" (mousedown)="startResize($event, 'w')"></div>
  <div class="fab-resize-handle handle-ne" (mousedown)="startResize($event, 'ne')"></div>
  <div class="fab-resize-handle handle-nw" (mousedown)="startResize($event, 'nw')"></div>
  <div class="fab-resize-handle handle-se" (mousedown)="startResize($event, 'se')"></div>
  <div class="fab-resize-handle handle-sw" (mousedown)="startResize($event, 'sw')"></div>

  <!-- HEADER (draggable) -->
  <div class="fab-header" (mousedown)="startDrag($event)">
    <div class="fab-header-left">
      <div class="fab-avatar">
        <i class="bi bi-robot"></i>
      </div>
      <div>
        <span class="fab-title">Asistente IA</span>
        <span class="fab-status">
          <span class="fab-status-dot"></span>
          En línea · <span class="credits-link" (click)="openCreditsModal(); $event.stopPropagation()">{{ creditsAvailable }} créditos</span>
        </span>
      </div>
    </div>
    <div class="fab-header-right" (mousedown)="$event.stopPropagation()">
      <button class="fab-header-btn" (click)="toggleExpand()" [title]="isExpanded ? 'Contraer' : 'Expandir'">
        <i class="bi" [ngClass]="isExpanded ? 'bi-arrows-angle-contract' : 'bi-arrows-angle-expand'"></i>
      </button>
      <button class="fab-header-btn" (click)="goToFullAssistant()" title="Abrir asistente completo">
        <i class="bi bi-arrows-fullscreen"></i>
      </button>
      <button class="fab-header-btn" (click)="toggleChat()" title="Cerrar chat">
        <i class="bi bi-x-lg"></i>
      </button>
    </div>
  </div>

  <!-- BODY -->
  <div class="fab-body" #fabChatBody>
    <div *ngFor="let msg of messages; trackBy: trackByMsgId"
         class="fab-message"
         [class.msg-user]="msg.role === 'user'"
         [class.msg-assistant]="msg.role === 'assistant'">

      <div class="fab-bubble" *ngIf="!msg.isTyping">
        <div [innerHTML]="formatText(msg.text)"></div>
        <span class="fab-time">{{ formatTime(msg.timestamp) }}</span>
      </div>

      <div class="fab-bubble typing-bubble" *ngIf="msg.isTyping">
        <div class="fab-typing">
          <span></span><span></span><span></span>
        </div>
      </div>
    </div>

    <!-- QUICK SUGGESTIONS -->
    <div class="fab-quick-suggestions" *ngIf="messages.length <= 2">
      <button *ngFor="let chip of quickSuggestions"
              class="fab-quick-chip"
              (click)="sendQuick(chip)">
        <i class="bi {{ chip.icon }}"></i>
        {{ chip.text }}
      </button>
    </div>
  </div>

  <!-- INPUT -->
  <div class="fab-input-bar">
    <input
      class="fab-input"
      [(ngModel)]="userInput"
      (keydown)="onKeyDown($event)"
      placeholder="Escribe tu pregunta..."
      [disabled]="isResponding"
    />
    <button *ngIf="isResponding"
            class="fab-cancel"
            (click)="cancelPendingRequest()"
            aria-label="Cancelar"
            title="Cancelar peticion">
      <i class="bi bi-x-circle-fill"></i>
    </button>
    <button *ngIf="!isResponding"
            class="fab-send"
            [class.active]="userInput.trim().length > 0"
            [disabled]="!userInput.trim()"
            (click)="sendMessage()"
            aria-label="Enviar mensaje">
      <i class="bi bi-send-fill"></i>
    </button>
  </div>
</div>

<!-- MODAL DE CRÉDITOS -->
<app-credits-modal
  *ngIf="showCreditsModal"
  [userId]="userId"
  [creditsAvailable]="creditsAvailable"
  (closed)="closeCreditsModal()"
  (creditsPurchased)="creditsAvailable = $event">
</app-credits-modal>
