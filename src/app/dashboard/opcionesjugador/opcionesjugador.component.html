<app-publicidad></app-publicidad>

<!-- BOTÓN VOLVER -->
<div class="back-container">
  <button class="btn-back-clean" (click)="goBack()">
    <i class="bi bi-arrow-left"></i>
    <span>{{ 'COMMON.BACK' | translate }}</span>
  </button>
</div>

<div class="container dashboard-container">
  <!-- ROW 1 -->
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(2)">
      <div class="dashboard-card bg-personal-data">
        <div class="card-overlay">
          <i class="bi bi-person card-action-icon"></i>
          <h5>Datos personales</h5>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(4)">
      <div class="dashboard-card bg-calendar">
        <div class="card-overlay">
          <i class="bi bi-calendar-event card-action-icon"></i>
          <h5>Calendario</h5>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(9)">
      <div class="dashboard-card bg-pay-fees">
        <div class="card-overlay">
          <i class="bi bi-credit-card card-action-icon"></i>
          <h5>Pagar cuotas</h5>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(10)">
      <div class="dashboard-card bg-documents">
        <div class="card-overlay">
          <i class="bi bi-file-earmark-pdf card-action-icon"></i>
          <h5>Documentación</h5>
        </div>
      </div>
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row g-3 mt-3">
    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(3)">
      <div class="dashboard-card bg-ranking">
        <div class="card-overlay">
          <i class="bi bi-trophy card-action-icon"></i>
          <h5>Clasificación y resultados</h5>
        </div>
      </div>
    </div>

    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(7)">
      <div class="dashboard-card bg-my-stats">
        <div class="card-overlay">
          <i class="bi bi-graph-up card-action-icon"></i>
          <h5>Mis estadísticas</h5>
        </div>
      </div>
    </div>

    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(8)">
      <div class="dashboard-card bg-gallery">
        <div class="card-overlay">
          <i class="bi bi-images card-action-icon"></i>
          <h5>Galería</h5>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(6)">
      <div class="dashboard-card bg-notifications">
        <div class="card-overlay">
          <i class="bi bi-bell card-action-icon"></i>
          <h5>Notificaciones</h5>
        </div>
      </div>
    </div>
  </div>

  <!-- ROW 3 -->
  <div *ngIf="showOpcionesOk" class="row g-3 mt-3">
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(5)">
      <div class="dashboard-card bg-sponsors">
        <div class="card-overlay">
          <i class="bi bi-collection card-action-icon"></i>
          <h5>Patrocinadores</h5>
        </div>
      </div>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(11)">
      <div class="dashboard-card bg-injuries">
        <div class="card-overlay">
          <i class="bi bi-heart-pulse card-action-icon"></i>
          <h5>Lesiones</h5>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-bottom-spacer"></div>
</div>
