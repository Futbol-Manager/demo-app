<app-publicidad></app-publicidad>

<!-- BOTÓN VOLVER -->
<div class="back-container">
  <button class="btn-back-clean" (click)="goBack()">
    <i class="bi bi-arrow-left"></i>
    <span>{{ 'COMMON.BACK' | translate }}</span>
  </button>
</div>

<div class="container dashboard-container">
  <!-- ROW 1 -->
  <div class="row g-3">
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(2)">
      <app-dashboard-card icon="bi bi-person" [title]="'OPCIONES_JUGADOR.DATOS_PERSONALES' | translate" bgClass="bg-personal-data"></app-dashboard-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(4)">
      <app-dashboard-card icon="bi bi-calendar-event" [title]="'OPCIONES_JUGADOR.CALENDARIO' | translate" bgClass="bg-calendar"></app-dashboard-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(9)">
      <app-dashboard-card icon="bi bi-credit-card" [title]="'OPCIONES_JUGADOR.PAGAR_CUOTAS' | translate" bgClass="bg-pay-fees"></app-dashboard-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(10)">
      <app-dashboard-card icon="bi bi-file-earmark-pdf" [title]="'OPCIONES_JUGADOR.DOCUMENTACION' | translate" bgClass="bg-documents"></app-dashboard-card>
    </div>
  </div>

  <!-- ROW 2 -->
  <div class="row g-3 mt-3">
    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(3)">
      <app-dashboard-card icon="bi bi-trophy" [title]="'OPCIONES_JUGADOR.CLASIFICACION_RESULTADOS' | translate" bgClass="bg-ranking"></app-dashboard-card>
    </div>
    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(7)">
      <app-dashboard-card icon="bi bi-graph-up" [title]="'OPCIONES_JUGADOR.MIS_ESTADISTICAS' | translate" bgClass="bg-my-stats"></app-dashboard-card>
    </div>
    <div *ngIf="showOpcionesOk" class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(8)">
      <app-dashboard-card icon="bi bi-images" [title]="'OPCIONES_JUGADOR.GALERIA' | translate" bgClass="bg-gallery"></app-dashboard-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(6)">
      <app-dashboard-card icon="bi bi-bell" [title]="'OPCIONES_JUGADOR.NOTIFICACIONES' | translate" bgClass="bg-notifications"></app-dashboard-card>
    </div>
  </div>

  <!-- ROW 3 -->
  <div *ngIf="showOpcionesOk" class="row g-3 mt-3">
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(5)">
      <app-dashboard-card icon="bi bi-collection" [title]="'OPCIONES_JUGADOR.PATROCINADORES' | translate" bgClass="bg-sponsors"></app-dashboard-card>
    </div>
    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(11)">
      <app-dashboard-card icon="bi bi-heart-pulse" [title]="'OPCIONES_JUGADOR.LESIONES' | translate" bgClass="bg-injuries"></app-dashboard-card>
    </div>

    <div class="col-12 col-sm-6 col-lg-3" (click)="irAPantalla(12)">
      <div class="dashboard-card bg-scouting-profile">
        <div class="card-overlay">
          <i class="bi bi-binoculars card-action-icon"></i>
          <h5>{{ 'PLAYER_SCOUTING.TITLE' | translate }}</h5>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-bottom-spacer"></div>
</div>
