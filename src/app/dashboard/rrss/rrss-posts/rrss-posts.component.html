<div class="posts-container">

  <!-- Toolbar -->
  <div class="posts-toolbar">
    <select [(ngModel)]="networkFilter" (change)="load()" class="form-select form-select-sm">
      <option value="">Todas las redes</option>
      <option value="instagram">Instagram</option>
      <option value="facebook">Facebook</option>
      <option value="linkedin">LinkedIn</option>
      <option value="twitter">Twitter/X</option>
    </select>
    <select [(ngModel)]="statusFilter" (change)="load()" class="form-select form-select-sm">
      <option value="">Todos los estados</option>
      <option value="DRAFT">Borrador</option>
      <option value="APPROVED">Aprobado</option>
      <option value="SCHEDULED">Programado</option>
      <option value="PUBLISHED">Publicado</option>
      <option value="REJECTED">Rechazado</option>
    </select>
    <button class="btn btn-sm btn-outline-secondary" (click)="load()" title="Recargar">
      <i class="bi bi-arrow-clockwise"></i>
    </button>
    <button class="btn btn-sm btn-primary ms-auto" (click)="openCreate()">
      <i class="bi bi-plus-lg me-1"></i> Nuevo post
    </button>
  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="text-center py-5">
    <div class="spinner-border spinner-border-sm text-primary"></div>
  </div>

  <!-- Empty -->
  <div *ngIf="!loading && posts.length === 0" class="empty-state">
    <div class="empty-icon"><i class="bi bi-layout-text-sidebar-reverse"></i></div>
    <p>No hay posts todavía.<br>Crea uno o genera desde el Calendario.</p>
    <button class="btn btn-primary btn-sm" (click)="openCreate()">
      <i class="bi bi-plus-lg me-1"></i> Crear post
    </button>
  </div>

  <!-- Groups -->
  <div *ngIf="!loading && posts.length > 0" class="network-groups">
    <div class="network-group" *ngFor="let group of groups" [ngClass]="'net-' + group.network">

      <div class="group-header" (click)="toggleGroup(group)">
        <span class="group-network-badge" [ngClass]="'net-' + group.network">
          <i class="bi" [ngClass]="networkIcon(group.network)"></i>
          {{ group.label }}
        </span>
        <span class="group-count">{{ group.posts.length }}</span>
        <i class="bi toggle-icon" [ngClass]="group.collapsed ? 'bi-chevron-down' : 'bi-chevron-up'"></i>
      </div>

      <div class="group-row" *ngIf="!group.collapsed">
        <div class="post-card" *ngFor="let post of group.posts">
          <div class="post-card-top"></div>
          <div class="post-card-body">
            <div class="post-card-header">
              <span class="status-badge" [ngClass]="statusClass(post.status)">
                {{ statusLabel(post.status) }}
              </span>
              <span class="thread-badge-card" *ngIf="post.is_thread" title="Hilo de tweets">
                🧵 Hilo
              </span>
              <span class="post-date" *ngIf="post.scheduled_at">
                <i class="bi bi-clock"></i>
                {{ post.scheduled_at | date:'dd/MM/yy HH:mm' }}
              </span>
            </div>

            <div class="post-content">{{ post.text_content | slice:0:160 }}{{ post.text_content?.length > 160 ? '…' : '' }}</div>

            <div *ngIf="post.image_url" class="post-image">
              <img [src]="post.image_url" alt="Imagen">
            </div>

            <div class="post-actions">
              <button class="btn btn-xs btn-outline-primary" (click)="openEdit(post)" title="Editar">
                <i class="bi bi-pencil"></i>
              </button>
              <button class="btn btn-xs btn-outline-success" *ngIf="post.status === 'DRAFT'" (click)="approve(post)" title="Aprobar">
                <i class="bi bi-check-lg"></i>
              </button>
              <button class="btn btn-xs btn-outline-warning" *ngIf="post.status === 'APPROVED'" (click)="reject(post)" title="Rechazar">
                <i class="bi bi-x-lg"></i>
              </button>
              <button class="btn btn-xs btn-outline-danger ms-auto" (click)="deletePost(post)" title="Eliminar">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<app-post-editor-modal
  *ngIf="showEditorModal"
  [post]="editingPost"
  (saved)="onEditorSaved($event)"
  (closed)="onEditorClosed()">
</app-post-editor-modal>
