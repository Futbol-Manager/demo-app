<div *ngIf="visible"
     class="tutorial-trigger"
     [style.left.px]="position.left"
     [style.top.px]="position.top"
     [class.tutorial-trigger--dragging]="isDragging"
     (mousedown)="onWrapMouseDown($event)"
     (touchstart)="onWrapTouchStart($event)"
     role="group"
     [attr.aria-label]="'TUTORIAL.ARIA_DRAG' | translate">
  <span class="tutorial-trigger__drag" aria-hidden="true" [title]="'TUTORIAL.DRAG_TITLE' | translate">
    <i class="bi bi-grip-vertical" aria-hidden="true"></i>
  </span>
  <button
    type="button"
    class="tutorial-trigger__cta"
    (click)="onMainButtonClick()"
    [attr.aria-label]="label"
  >
    <i class="bi bi-play-fill" aria-hidden="true"></i>
    <span class="tutorial-trigger__label sr-only">{{ label }}</span>
  </button>
  <div class="tutorial-trigger__chip">
    <span class="tutorial-trigger__chip-text">{{ label }}</span>
  </div>
  <div class="tutorial-trigger__dropdown">
    <button type="button"
            class="tutorial-trigger__dropdown-btn"
            (click)="onDropdownToggle($event)"
            aria-haspopup="true"
            [attr.aria-expanded]="dropdownOpen"
            [attr.aria-label]="'TUTORIAL.ARIA_OPTIONS' | translate">
      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </button>
    <div *ngIf="dropdownOpen" class="tutorial-trigger__menu" (click)="$event.stopPropagation()" role="menu">
      <button type="button" class="tutorial-trigger__menu-item" (click)="openTutorial()" role="menuitem">
        <i class="bi bi-play-circle" aria-hidden="true"></i>
        <span>{{ 'TUTORIAL.BTN_OPEN' | translate }}</span>
      </button>
      <button type="button" class="tutorial-trigger__menu-item tutorial-trigger__menu-item--muted" (click)="dontShowAgain()" role="menuitem">
        <i class="bi bi-eye-slash" aria-hidden="true"></i>
        <span>{{ 'TUTORIAL.BTN_DONT_SHOW' | translate }}</span>
      </button>
    </div>
  </div>
  <div *ngIf="dropdownOpen" class="tutorial-trigger__backdrop" (click)="closeDropdown()" role="presentation"></div>
</div>
