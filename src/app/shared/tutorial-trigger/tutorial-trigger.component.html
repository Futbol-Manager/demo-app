<div *ngIf="visible"
     class="tutorial-trigger-wrap"
     [style.left.px]="position.left"
     [style.top.px]="position.top"
     [class.dragging]="isDragging"
     (mousedown)="onWrapMouseDown($event)"
     (touchstart)="onWrapTouchStart($event)"
     role="group"
     [attr.aria-label]="'Botón Ver tutorial. Arrastra para mover.'">
  <span class="tutorial-trigger-drag" aria-hidden="true" title="Arrastra para mover">
    <i class="bi bi-grip-vertical"></i>
  </span>
  <button type="button"
          class="tutorial-trigger-btn"
          (click)="onMainButtonClick()"
          [attr.aria-label]="label">
    <i class="bi bi-play-circle-fill"></i>
    <span class="tutorial-trigger-label">{{ label }}</span>
  </button>
  <div class="tutorial-trigger-dropdown-wrap">
    <button type="button"
            class="tutorial-trigger-dropdown-toggle"
            (click)="onDropdownToggle($event)"
            aria-haspopup="true"
            [attr.aria-expanded]="dropdownOpen"
            aria-label="Opciones del tutorial">
      <i class="bi bi-chevron-down"></i>
    </button>
    <div *ngIf="dropdownOpen" class="tutorial-trigger-dropdown-menu" (click)="$event.stopPropagation()">
      <button type="button" class="tutorial-trigger-dropdown-item" (click)="openTutorial()">
        <i class="bi bi-play-circle"></i>
        <span>Ver tutorial</span>
      </button>
      <button type="button" class="tutorial-trigger-dropdown-item tutorial-trigger-dropdown-item-muted" (click)="dontShowAgain()">
        <i class="bi bi-eye-slash"></i>
        <span>No mostrar de nuevo aquí</span>
      </button>
    </div>
  </div>
  <div *ngIf="dropdownOpen" class="tutorial-trigger-backdrop" (click)="closeDropdown()" role="presentation"></div>
</div>
