<div *ngIf="isOpen" class="tutorial-overlay" [class.tutorial-overlay-spotlight]="spotlightRect" (click)="onBackdropClick()" role="presentation">
  <!-- Efecto spotlight: resto de pantalla oscuro/desenfocado, solo el elemento objetivo queda enfocado -->
  <div *ngIf="spotlightRect" class="tutorial-spotlight" [style.left.px]="spotlightRect.left" [style.top.px]="spotlightRect.top" [style.width.px]="spotlightRect.width" [style.height.px]="spotlightRect.height" aria-hidden="true"></div>
  <div class="tutorial-card" (click)="$event.stopPropagation()" role="dialog" aria-labelledby="tutorial-title" aria-describedby="tutorial-desc">
    <div class="tutorial-card-header">
      <div class="tutorial-progress" aria-hidden="true">
        <span class="tutorial-progress-text">{{ stepIndex }} / {{ stepTotal }}</span>
        <div class="tutorial-progress-bar">
          <div class="tutorial-progress-fill" [style.width.%]="stepTotal ? (stepIndex / stepTotal) * 100 : 0"></div>
        </div>
      </div>
      <button type="button" class="tutorial-close" (click)="onClose()" aria-label="Cerrar tutorial">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <div class="tutorial-card-body">
      <h2 id="tutorial-title" class="tutorial-title">{{ title }}</h2>
      <p id="tutorial-desc" class="tutorial-text">{{ text }}</p>
    </div>

    <div class="tutorial-card-footer">
      <label class="tutorial-dont-show">
        <input type="checkbox" [checked]="dontShowAgain" (change)="onDontShowAgainChange($any($event.target).checked)">
        <span>No volver a mostrar en esta pantalla</span>
      </label>
      <div class="tutorial-actions">
        <button *ngIf="!isFirst" type="button" class="tutorial-btn tutorial-btn-secondary" (click)="onPrevious()">
          <i class="fas fa-arrow-left"></i> Anterior
        </button>
        <button type="button" class="tutorial-btn tutorial-btn-primary" (click)="onNext()">
          {{ isLast ? 'Entendido' : 'Siguiente' }} <i class="fas" [class.fa-check]="isLast" [class.fa-arrow-right]="!isLast"></i>
        </button>
      </div>
    </div>
  </div>
</div>
