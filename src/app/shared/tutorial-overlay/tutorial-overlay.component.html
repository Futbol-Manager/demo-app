<div *ngIf="isOpen" class="tutorial-overlay" [class.tutorial-overlay-spotlight]="spotlightRect" role="presentation">
  <!-- Efecto spotlight -->
  <div *ngIf="spotlightRect" class="tutorial-spotlight"
    [style.left.px]="spotlightRect.left"
    [style.top.px]="spotlightRect.top"
    [style.width.px]="spotlightRect.width"
    [style.height.px]="spotlightRect.height"
    aria-hidden="true">
  </div>

  <div class="tutorial-card" [ngStyle]="cardStyle"
    [class.is-dragging]="isDragging"
    (mousedown)="onCardMouseDown($event)"
    (touchstart)="onCardTouchStart($event)"
    (click)="$event.stopPropagation()"
    role="dialog" aria-labelledby="tutorial-title" aria-describedby="tutorial-desc">

    <!-- Flecha dinámica azul Sphaira hacia el elemento destacado -->
    <div *ngIf="arrowSide" class="tutorial-arrow tutorial-arrow--sphaira" [class.tutorial-arrow--left]="arrowSide === 'left'"
      [class.tutorial-arrow--right]="arrowSide === 'right'" [class.tutorial-arrow--top]="arrowSide === 'top'"
      [class.tutorial-arrow--bottom]="arrowSide === 'bottom'" [ngStyle]="arrowPositionStyle || {}" aria-hidden="true">
      <!-- Curva + punta: izquierda -->
      <svg *ngIf="arrowSide === 'left'" class="tutorial-arrow-svg" viewBox="0 0 70 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tutorial-arrow-grad-l" x1="100%" y1="0%" x2="0%" y2="0%">
            <stop offset="0%" stop-color="#0a4a6e"/>
            <stop offset="100%" stop-color="#002c40"/>
          </linearGradient>
          <filter id="tutorial-arrow-glow-l">
            <feGaussianBlur stdDeviation="1" result="blur"/>
            <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <path class="tutorial-arrow-curve tutorial-arrow-line" d="M 62 18 C 38 6 22 30 8 18" stroke="url(#tutorial-arrow-grad-l)" stroke-width="4" stroke-linecap="round"/>
        <!-- Punta chevron <: base en (8,18), punta en (0,18) -->
        <path class="tutorial-arrow-head" d="M 8 8 L 0 18 L 8 28 Z" fill="url(#tutorial-arrow-grad-l)" stroke="url(#tutorial-arrow-grad-l)" stroke-width="0.8" stroke-linejoin="miter" filter="url(#tutorial-arrow-glow-l)"/>
      </svg>
      <!-- Curva + punta: derecha -->
      <svg *ngIf="arrowSide === 'right'" class="tutorial-arrow-svg" viewBox="0 0 70 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tutorial-arrow-grad-r" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0a4a6e"/><stop offset="100%" stop-color="#002c40"/></linearGradient>
          <filter id="tutorial-arrow-glow-r"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="tutorial-arrow-curve tutorial-arrow-line" d="M 8 18 C 32 6 48 30 62 18" stroke="url(#tutorial-arrow-grad-r)" stroke-width="4" stroke-linecap="round"/>
        <!-- Punta chevron >: base en (62,18), punta en (70,18) -->
        <path class="tutorial-arrow-head" d="M 62 8 L 70 18 L 62 28 Z" fill="url(#tutorial-arrow-grad-r)" stroke="url(#tutorial-arrow-grad-r)" stroke-width="0.8" stroke-linejoin="miter" filter="url(#tutorial-arrow-glow-r)"/>
      </svg>
      <!-- Curva + punta: arriba -->
      <svg *ngIf="arrowSide === 'top'" class="tutorial-arrow-svg" viewBox="0 0 36 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tutorial-arrow-grad-t" x1="0%" y1="100%" x2="0%" y2="0%"><stop offset="0%" stop-color="#0a4a6e"/><stop offset="100%" stop-color="#002c40"/></linearGradient>
          <filter id="tutorial-arrow-glow-t"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="tutorial-arrow-curve tutorial-arrow-line" d="M 18 62 C 6 38 30 22 18 8" stroke="url(#tutorial-arrow-grad-t)" stroke-width="4" stroke-linecap="round"/>
        <!-- Punta chevron ^: base en (18,8), punta en (18,0) -->
        <path class="tutorial-arrow-head" d="M 8 8 L 18 0 L 28 8 Z" fill="url(#tutorial-arrow-grad-t)" stroke="url(#tutorial-arrow-grad-t)" stroke-width="0.8" stroke-linejoin="miter" filter="url(#tutorial-arrow-glow-t)"/>
      </svg>
      <!-- Curva + punta: abajo -->
      <svg *ngIf="arrowSide === 'bottom'" class="tutorial-arrow-svg" viewBox="0 0 36 70" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="tutorial-arrow-grad-b" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="#0a4a6e"/><stop offset="100%" stop-color="#002c40"/></linearGradient>
          <filter id="tutorial-arrow-glow-b"><feGaussianBlur stdDeviation="1" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        </defs>
        <path class="tutorial-arrow-curve tutorial-arrow-line" d="M 18 8 C 30 32 6 48 18 62" stroke="url(#tutorial-arrow-grad-b)" stroke-width="4" stroke-linecap="round"/>
        <!-- Punta chevron v: base en (18,62), punta en (18,70) -->
        <path class="tutorial-arrow-head" d="M 8 62 L 18 70 L 28 62 Z" fill="url(#tutorial-arrow-grad-b)" stroke="url(#tutorial-arrow-grad-b)" stroke-width="0.8" stroke-linejoin="miter" filter="url(#tutorial-arrow-glow-b)"/>
      </svg>
    </div>

    <!-- Cabecera: progreso + controles de audio + cerrar -->
    <div class="tutorial-card-header">
      <div class="tutorial-progress" aria-hidden="true">
        <span class="tutorial-progress-text">{{ stepIndex }} / {{ stepTotal }}</span>
        <div class="tutorial-progress-bar tutorial-progress-bar--clickable" role="progressbar"
          [attr.aria-valuenow]="stepIndex" [attr.aria-valuemin]="1" [attr.aria-valuemax]="stepTotal"
          [attr.title]="stepTotal > 1 ? 'Clic para ir a un paso' : null"
          (click)="stepTotal > 1 && onProgressBarClick($event)">
          <div class="tutorial-progress-fill" [style.width.%]="stepTotal ? (stepIndex / stepTotal) * 100 : 0"></div>
        </div>
      </div>

      <div class="tutorial-audio-controls">
        <!-- Play / Pause del paso actual -->
        <button type="button" class="tutorial-audio-btn"
          (click)="togglePlayPause()"
          [title]="audioPlaying ? 'Pausar audio' : 'Reproducir audio'"
          [class.is-playing]="audioPlaying"
          [disabled]="!audioEnabled">
          <i class="fas" [class.fa-pause]="audioPlaying" [class.fa-play]="!audioPlaying"></i>
        </button>
        <!-- Activar / silenciar audio para todo el tutorial -->
        <button type="button" class="tutorial-audio-btn tutorial-audio-mute"
          (click)="toggleAudio()"
          [title]="audioEnabled ? 'Silenciar tutorial' : 'Activar audio del tutorial'">
          <i class="fas" [class.fa-volume-up]="audioEnabled" [class.fa-volume-mute]="!audioEnabled"></i>
        </button>
      </div>

      <button type="button" class="tutorial-close" (click)="onClose()" aria-label="Cerrar tutorial">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <!-- Cuerpo: transición suave entre pasos + último paso con check premium -->
    <div class="tutorial-card-body" [class.tutorial-card-body--last]="isLast">
      <div *ngFor="let step of [stepIndex]; trackBy: trackByStepId" class="tutorial-step-content">
      <ng-container *ngIf="isLast; else bodyDefault">
        <div class="tutorial-check-premium" aria-hidden="true">
          <div class="tutorial-check-circle">
            <svg viewBox="0 0 120 120" class="tutorial-check-svg" focusable="false">
              <circle class="tutorial-check-circle-bg" cx="60" cy="60" r="54" fill="none" stroke="url(#tutorial-check-gradient)" stroke-width="4"/>
              <path class="tutorial-check-path" fill="none" stroke="url(#tutorial-check-gradient)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" d="M 32 60 L 52 80 L 88 44"/>
              <defs>
                <linearGradient id="tutorial-check-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#1e8832"/>
                  <stop offset="100%" stop-color="#31b270"/>
                </linearGradient>
              </defs>
            </svg>
          </div>
        </div>
        <h2 id="tutorial-title" class="tutorial-title tutorial-title--last">{{ title }}</h2>
        <p id="tutorial-desc" class="tutorial-text tutorial-text--last">{{ text }}</p>
      </ng-container>
      <ng-template #bodyDefault>
        <p *ngIf="audioPlayBlocked && currentStepAudioFile" class="tutorial-audio-hint">
          <i class="fas fa-volume-up"></i> Pulsa el botón <i class="fas fa-play"></i> para escuchar el audio.
        </p>
        <h2 id="tutorial-title" class="tutorial-title">{{ title }}</h2>
        <p id="tutorial-desc" class="tutorial-text">{{ text }}</p>
      </ng-template>
      </div>
    </div>

    <!-- Pie: navegación -->
    <div class="tutorial-card-footer">
      <div class="tutorial-actions">
        <button *ngIf="isFirst" type="button" class="tutorial-btn tutorial-btn-skip" (click)="onSkipTutorial()">
          Ver más tarde
        </button>
        <button *ngIf="!isFirst" type="button" class="tutorial-btn tutorial-btn-secondary" (click)="onPrevious()">
          <i class="fas fa-arrow-left"></i> Anterior
        </button>
        <button *ngIf="isLast" type="button" class="tutorial-btn tutorial-btn-secondary" (click)="onRepeatTutorial()">
          <i class="fas fa-redo"></i> Repetir tutorial
        </button>
        <button type="button" class="tutorial-btn tutorial-btn-primary" (click)="onNext()">
          {{ isLast ? 'Entendido' : 'Siguiente' }} <i class="fas" [class.fa-check]="isLast" [class.fa-arrow-right]="!isLast"></i>
        </button>
      </div>
    </div>

  </div>
</div>
