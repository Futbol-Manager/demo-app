<div class="background">

  <div class="overlay">

    <div class="validate-container">

      <div class="validate-card">

        <!-- HEADER -->
        <div class="validate-header">
          <img
            src="assets/images/Logo_SphairaTech1.svg"
            alt="Sphaira Tech"
            class="validate-logo"
          />
        </div>

        <!-- BODY -->
        <div class="validate-body">
          <h2 class="validate-title">
            {{ 'VALIDATION.TITLE' | translate }}
          </h2>

          <p class="validate-text">
            {{ 'VALIDATION.DESCRIPTION' | translate }}
          </p>

          <button
            class="btn-validate"
            (click)="validarUsuario()"
          >
            {{ 'VALIDATION.BUTTON' | translate }}
          </button>
        </div>

        <!-- FOOTER -->
        <div class="validate-footer">
          <p class="validate-footer-text">
            {{ 'VALIDATION.FOOTER' | translate }}
          </p>
        </div>

      </div>

    </div>
  </div>
</div>
