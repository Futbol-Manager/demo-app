<div class="homepage-container">
  <!-- Encabezado con botones utilizando Bootstrap -->
  <div class="d-flex justify-content-between">
    <button class="btn btn-primary" (click)="verPerfil()">Ver Perfil</button>
    <button class="btn btn-danger" (click)="cerrarSesion()">Cerrar Sesión</button>
  </div>

  <!-- Contenido principal con la tabla de equipos utilizando Bootstrap -->
  <div class="mt-4">
    <h2 class="text-white">Listado de Equipos de Fútbol</h2>

    <table class="table table-bordered table-light">
      <thead>
        <tr>
          <th scope="col">ID</th>
          <th scope="col">Nombre</th>
          <th scope="col">Categoría</th>
          <th scope="col">Días</th>
        </tr>
      </thead>
      <tbody>
        <!-- Itera sobre el listado de equipos y muestra la información -->
        <tr *ngFor="let team of listTeam">
          <td>{{ team.teamId }}</td>
          <td>{{ team.name }}</td>
          <td>{{ team.category }}</td>
          <td>{{ team.trainingDays }}</td>
        </tr>
      </tbody>
    </table>

    <!-- Botón para abrir el modal de creación de equipo -->
    <button class="btn btn-success" (click)="abrirModalCrearEquipo()">Crear Equipo</button>
  </div>
</div>

<!-- Modal para la creación de equipo -->
<div class="modal" tabindex="-1" role="dialog" [ngClass]="{'d-block': showModal}">
  <div class="modal-dialog" role="document">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Crear Equipo</h5>
        <button type="button" class="close" (click)="cerrarModal()">
          <span aria-hidden="true">&times;</span>
        </button>
      </div>
      <div class="modal-body">
        <!-- Formulario para la creación de equipo -->
        <form>
          <!-- Campo del formulario con ngModel y nombre asignado -->
          <div class="form-group">
            <label for="nombreEquipo">Nombre:</label>
            <input type="text" class="form-control" id="nombreEquipo" name="nombreEquipo"
              [(ngModel)]="teamNew.name">
          </div>
          <div class="form-group">
            <label for="nivelLiga">Nivel de Liga:</label>
            <input type="text" class="form-control" id="nivelLiga" name="nivelLiga" [(ngModel)]="teamNew.levelLeague">
          </div>
          <div class="form-group">
            <label for="objetivoEquipo">Objetivo del Equipo:</label>
            <input type="text" class="form-control" id="objetivoEquipo" name="objetivoEquipo" [(ngModel)]="teamNew.objectiveTeam">
          </div>
          <div class="form-group">
            <label for="opinionEquipo">Opinión del Equipo:</label>
            <input type="text" class="form-control" id="opinionEquipo" name="opinionEquipo" [(ngModel)]="teamNew.opinionTeam">
          </div>
          <div class="form-group">
            <label for="diasEntrenamiento">Días de Entrenamiento:</label>
            <input type="text" class="form-control" id="diasEntrenamiento" name="diasEntrenamiento" [(ngModel)]="teamNew.trainingDays">
          </div>
          <div class="form-group">
            <label for="categoriaEquipo">Categoría del Equipo:</label>
            <select class="form-control" id="categoriaEquipo" name="categoriaEquipo" [(ngModel)]="teamNew.categoryType.categoryTypeId">
              <!-- Puedes ajustar las opciones según tus necesidades -->
              <option value="1">Categoría 1</option>
              <option value="2">Categoría 2</option>
              <option value="3">Categoría 3</option>
              <option value="4">Categoría 4</option>
              <option value="5">Categoría 5</option>
            </select>
          </div>

          <!-- Botón para guardar el nuevo equipo -->
          <button type="button" class="btn btn-primary" (click)="crearEquipo()">Guardar</button>
        </form>
      </div>
    </div>
  </div>
</div>
