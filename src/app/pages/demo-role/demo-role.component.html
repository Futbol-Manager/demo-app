<div class="demo-role-page">
  <div class="demo-role-bg" aria-hidden="true">
    <div class="demo-role-bg-gradient"></div>
    <div class="demo-role-bg-pattern"></div>
  </div>

  <div class="demo-role-container">
    <header class="demo-role-header" data-tutorial="dr-header">
      <span class="demo-role-badge">{{ 'DEMO_ROLE.BADGE' | translate }}</span>
      <img [src]="logoSrc" alt="Sphaira Tech" class="demo-role-logo" />
      <h1 class="demo-role-title">{{ 'DEMO_ROLE.TITLE' | translate }}</h1>
      <p class="demo-role-subtitle">{{ 'DEMO_ROLE.SUBTITLE' | translate }}</p>
      <button type="button" class="demo-role-tutorial-btn" (click)="openTutorial()" [attr.aria-label]="'DEMO_ROLE.TUTORIAL_BTN' | translate">
        <i class="bi bi-play-circle"></i> {{ 'DEMO_ROLE.TUTORIAL_BTN' | translate }}
      </button>
    </header>

    <div class="demo-role-cards" data-tutorial="dr-cards">
      <button type="button" class="demo-role-card demo-role-card-1" (click)="selectRole('club')" [attr.aria-label]="'DEMO_ROLE.CLUB_CTA' | translate" data-tutorial="dr-club">
        <span class="demo-role-card-accent" aria-hidden="true"></span>
        <span class="demo-role-icon" aria-hidden="true">
          <i class="bi bi-building"></i>
        </span>
        <h2 class="demo-role-card-title">{{ 'DEMO_ROLE.CLUB_TITLE' | translate }}</h2>
        <p class="demo-role-card-desc">{{ 'DEMO_ROLE.CLUB_DESC' | translate }}</p>
        <span class="demo-role-card-cta">{{ 'DEMO_ROLE.CLUB_CTA' | translate }}</span>
      </button>

      <button type="button" class="demo-role-card demo-role-card-2" (click)="selectRole('coach')" [attr.aria-label]="'DEMO_ROLE.COACH_CTA' | translate" data-tutorial="dr-coach">
        <span class="demo-role-card-accent" aria-hidden="true"></span>
        <span class="demo-role-icon" aria-hidden="true">
          <i class="bi bi-person-badge"></i>
        </span>
        <h2 class="demo-role-card-title">{{ 'DEMO_ROLE.COACH_TITLE' | translate }}</h2>
        <p class="demo-role-card-desc">{{ 'DEMO_ROLE.COACH_DESC' | translate }}</p>
        <span class="demo-role-card-cta">{{ 'DEMO_ROLE.COACH_CTA' | translate }}</span>
      </button>

      <button type="button" class="demo-role-card demo-role-card-3" (click)="selectRole('player')" [attr.aria-label]="'DEMO_ROLE.PLAYER_CTA' | translate" data-tutorial="dr-player">
        <span class="demo-role-card-accent" aria-hidden="true"></span>
        <span class="demo-role-icon" aria-hidden="true">
          <i class="bi bi-person"></i>
        </span>
        <h2 class="demo-role-card-title">{{ 'DEMO_ROLE.PLAYER_TITLE' | translate }}</h2>
        <p class="demo-role-card-desc">{{ 'DEMO_ROLE.PLAYER_DESC' | translate }}</p>
        <span class="demo-role-card-cta">{{ 'DEMO_ROLE.PLAYER_CTA' | translate }}</span>
      </button>
    </div>
  </div>
</div>
