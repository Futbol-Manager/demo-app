<form [formGroup]="loginForm" class="form-login" #thisForm="ngForm">

  <div class="mb-3">
    <label for="mail" class="form-label">Ingrese email</label>
    <input type="email" class="form-control input-login" id="mail" formControlName="mail">
    <div *ngFor="let validation of validationMessages.mail" class="mt-2">
      <div class="error-message" *ngIf="mailControl?.hasError('required') && (mailControl?.dirty || mailControl?.touched || thisForm.submitted)">
        Correo electrónico requerido
      </div>
    </div>
  </div>

  <div class="mb-3">
    <label for="password" class="form-label">Ingrese contraseña</label>
    <div class="input-group">
      <input type="password" class="form-control input-login" id="password" formControlName="password" [type]="hidePassword ? 'password' : 'text'">
      <button class="btn btn-outline-secondary" type="button" (click)="hidePassword = !hidePassword">
        <i class="fas" [class.fa-eye]="!hidePassword" [class.fa-eye-slash]="hidePassword"></i>
      </button>
    </div>
    <div *ngFor="let validation of validationMessages.password" class="mt-2">
      <div class="error-message" *ngIf="passwordControl?.hasError('required') && (passwordControl?.dirty || passwordControl?.touched || thisForm.submitted)">
        Contraseña requerida
      </div>
    </div>
  </div>

  <button type="submit" class="btn btn-primary btn-block">Iniciar sesión</button>
</form>
