<form [formGroup]="loginForm" class="form-login" #thisForm="ngForm" (ngSubmit)="login()">

  <!-- Campo de email -->
  <div class="mb-3">
    <input type="email" class="form-control input-login" id="mail" formControlName="mail"
      [attr.placeholder]="'APP.LOGIN.EMAIL_PLACEHOLDER' | translate"
      [class.is-invalid]="mailControl?.invalid && (mailControl?.dirty || mailControl?.touched || thisForm.submitted)">

    <div *ngIf="mailControl?.hasError('required') && (mailControl?.dirty || mailControl?.touched || thisForm.submitted)"
      class="invalid-feedback">
      {{ 'APP.LOGIN.EMAIL_REQUIRED' | translate }}
    </div>

    <div *ngIf="mailControl?.hasError('email') && (mailControl?.dirty || mailControl?.touched || thisForm.submitted)"
      class="invalid-feedback">
      {{ 'APP.LOGIN.EMAIL_INVALID' | translate }}
    </div>
  </div>

  <!-- Campo de contraseña -->
  <div class="mb-3">
    <div class="input-group">
      <input class="form-control input-login" id="password" formControlName="password"
        [type]="hidePassword ? 'password' : 'text'" [attr.placeholder]="'APP.LOGIN.PASSWORD_PLACEHOLDER' | translate"
        [class.is-invalid]="passwordControl?.invalid && (passwordControl?.dirty || passwordControl?.touched || thisForm.submitted)">

      <div class="input-group-append">
        <button class="btn btn-outline-secondary input-login" type="button" (click)="hidePassword = !hidePassword">
          <i class="fas" [class.fa-eye]="!hidePassword" [class.fa-eye-slash]="hidePassword"></i>
        </button>
      </div>

      <div
        *ngIf="passwordControl?.hasError('required') && (passwordControl?.dirty || passwordControl?.touched || thisForm.submitted)"
        class="invalid-feedback">
        {{ 'APP.LOGIN.PASSWORD_REQUIRED' | translate }}
      </div>
    </div>
  </div>

  <!-- Botón de login -->
  <button type="submit" class="btn btn-custom btn-block textoCentrado">
    {{ 'APP.BUTTONS.LOGIN' | translate }}
  </button>

  <!-- Usuario bloqueado -->
  <div [ngStyle]="{ display: verificarCuenta ? 'block' : 'none' }" class="text-danger mt-3">
    <p>
      {{ 'APP.LOGIN.BLOCKED_MESSAGE' | translate }}
      <a href="#" (click)="enviarMail()">
        {{ 'APP.LOGIN.BLOCKED_LINK' | translate }}
      </a>
    </p>
  </div>
</form>
