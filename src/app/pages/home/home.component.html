<div class="background">
  <video autoplay loop muted playsinline class="video-background">
    <source src="assets/videos/jugando.mp4" type="video/mp4">
    Tu navegador no admite el elemento de video.
  </video>

  <!--LOGIN-->
  <div class="container" *ngIf="screen == 1">
    <div class="row justify-content-center" style="padding-top: 2%;">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header textoCentrado">
            <h1>Manager futbol por .Sphaira Tech</h1>
          </div>
          <div class="card-body textoCentrado">
            <app-login></app-login>
          </div>
          <div class="card-footer textoCentrado" style="flex-direction: column;">
            <div class="row">
              <div class="col-md-12 col-sm-12 textoCentrado">
                <p><a href="#">He olvidado mi contraseña</a></p>
              </div>
            </div>
            <div class="row">
              <div class="col-md-12 col-sm-12 textoCentrado">
                <p>¿No tienes una cuenta? <a href="#" (click)="toRegister($event)">Regístrate</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!--REGISTRO-->
  <div class="container" *ngIf="screen == 2">
    <div class="row justify-content-center" style="padding-top: 2%;">
      <div class="col-md-6">
        <div class="card">
          <div class="card-header textoCentrado">
            <h1>Registro de usuario</h1>
          </div>
          <div class="card-body textoCentrado">
            <app-register></app-register>
          </div>
          <div class="card-footer textoCentrado" style="flex-direction: column;">
            <div class="row">
              <div class="col-md-12 col-sm-12 textoCentrado">
                <p>¿Ya tienes una cuenta? <a href="#" (click)="toLogin($event)">Inicia sesión aquí</a></p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
